    reason: "j.seed (requester, chain, target, timestamp, counter) is only a per-job salt, not the randomness: runner selection uses keccak256(seed, blockhash(startBlock + 1), round), a block after the request/round opening, so neither the requester nor a runner retrying can pick it (contract docs, \"Lottery bound to a block nobody picks\"). Remaining, documented weakness: the proposer of block startBlock + 1 can grind that block's hash (validator-level bias), and on a chain whose BLOCKHASH is 0 the fallback is as predictable as the request. The chain's own randomness (PREVRANDAO from the PQ vote certificate, zetaphy-chain README item 8) is also proposer-biasable, so it would not remove the bias. Accepted for testnet; mainnet stakes on the lottery need commit-reveal or a VRF/beacon."
