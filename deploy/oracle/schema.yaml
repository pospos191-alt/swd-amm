title: "ZETAPHY node (Always Free)"
description: "Creates one free Ubuntu VM and installs ZETAPHY services automatically."
schemaVersion: 1.1.0
version: "20190304"
locale: "en"

variableGroups:
  - title: "Hidden"
    visible: false
    variables:
      - tenancy_ocid
      - region
      - compartment_ocid
  - title: "Machine"
    variables:
      - shape
      - roles
  - title: "Advanced (optional)"
    variables:
      - ssh_public_key
      - availability_domain
      - enable_run_command

variables:
  shape:
    type: enum
    title: "Machine size"
    description: "Both are free. A1.Flex = 1 CPU, 6 GB (recommended). E2.1.Micro = small; try it if A1 says Out of host capacity."
    enum:
      - VM.Standard.A1.Flex
      - VM.Standard.E2.1.Micro
    default: VM.Standard.A1.Flex
    required: true

  roles:
    type: enum
    title: "What to install"
    description: "runner = ZETAPHY runner, agents = helper agents, validator = ZETAPHY chain validator (joins and stakes by itself)."
    enum:
      - runner
      - agents
      - "runner,agents"
      - validator
      - "validator,runner"
    default: runner
    required: true

  ssh_public_key:
    type: oci:core:ssh:publickey
    title: "SSH public key"
    description: "Optional. Leave empty if unsure."
    required: false

  availability_domain:
    type: oci:identity:availabilitydomain:name
    title: "Availability domain"
    description: "Empty = first one. Try another if Out of host capacity."
    dependsOn:
      compartmentId: ${compartment_ocid}
    required: false

  enable_run_command:
    type: boolean
    title: "Allow console Run command"
    default: true

outputs:
  public_ip:
    type: copyableString
    title: "Public IP"
  instance_ocid:
    type: ocid
    title: "Instance OCID"
  next_steps:
    type: string
    title: "Next steps"
