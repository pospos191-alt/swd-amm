[package]
name = "swd_launch_guard"
version = "0.1.0"
description = "SWD Launch Guard — Token-2022 transfer-hook anti-bot for the first hours of a launch (UNAUDITED, not deployed; see docs/SWD_LAUNCH_GUARD.md)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "swd_launch_guard"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
# `token_2022` re-exports spl_token_2022 (mint / account extension parsing:
# TransferHook, TransferHookAccount). Same version line as swd_amm.
anchor-spl = { version = "0.31.1", features = ["token_2022"] }
# The SPL transfer-hook interface: the Execute discriminator and the
# ExtraAccountMetaList (TLV) that Token-2022 reads to find our extra accounts.
# Exactly the versions anchor-spl 0.31.1 / spl-token-2022 6.0.0 already pull
# in (Cargo.lock), so there is one copy of each.
spl-transfer-hook-interface = "0.9.0"
spl-tlv-account-resolution = "0.9.0"
spl-discriminator = "0.4.1"

# cfgs that Anchor's macros emit (silences "unexpected cfg" noise only)
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic", "anchor-debug"))'] }
