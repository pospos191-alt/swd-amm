[package]
name = "swd_mine"
version = "0.1.0"
description = "SWD on-chain mining payouts (PoW proofs on challenges signed by the website) — UNAUDITED, not deployed; see docs/SWD_MINE.md"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "swd_mine"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
# Mainnet build: `initialize` only accepts the real SWD mint
# (Cmh2tu6bt5z2a8NKsx6G5WfVmaeQ9f2fcX5VnQbVaGLL). Build with
# `anchor build -p swd_mine -- --features mainnet` for any mainnet deployment.
mainnet = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
# init-if-needed: the per-wallet Miner PDA is created on a wallet's first
# proof (the wallet pays its rent), and `claim` creates the wallet's SWD
# associated token account if it does not exist yet (the wallet pays).
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
# The program only accepts classic SPL Token accounts (SWD is a classic SPL
# Token mint, 5 decimals); default features are kept because the
# `token::token_program` / `associated_token::token_program` constraints
# expand to code that names `anchor_spl::token_interface`.
anchor-spl = "0.31.1"
