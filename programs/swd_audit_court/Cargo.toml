[package]
name = "swd_audit_court"
version = "0.1.0"
description = "SWD Audit Court — community disputes of SWD Audit results, badge-weighted votes, bonded (UNAUDITED, not deployed; see docs/SWD_AUDIT_COURT.md)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "swd_audit_court"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
# Mainnet build: voting period >= 3 days and the SWD mint as the only bond
# mint. Build with `anchor build -p swd_audit_court -- --features mainnet`.
mainnet = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
# `token` (classic SPL: the SWD bond, escrow vaults) and `token_2022` (the
# soulbound badge accounts: NonTransferable / NonTransferableAccount checks).
anchor-spl = { version = "0.31.1", features = ["token", "token_2022"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic", "anchor-debug"))'] }
