# Neuro federated learning: aggregate one round of browser updates
# (zetaphy-neuro/ml/fl, docs/future/federated.md).
#
# Not a server: a scheduled job on the free Actions allowance (a minute or
# two a week). It reads the last finished round's revealed updates from the
# FederatedRounds contract (testnet) and any signed envelopes committed under
# zetaphy-neuro/ml/fl/inbox/round-N/, aggregates them with a coordinate-wise
# trimmed mean, runs the canary gate, and, only if the gate passes, opens a
# pull request with the candidate head and its manifest. The pull request is
# not the decision: the manifest hash takes effect only after a governance
# vote schedules it in the ModelEpochs from a future block height.
#
# Where the round contract is: zetaphy-neuro/ml/fl/deployment.json (the same record the Neuro page
# reads; `rounds: null` = not deployed yet, and then only the inbox is read). Once a pull request
# commits a deployed record, the weekly job reads that contract with no settings at all.
# Optional repository VARIABLES (Settings -> Secrets and variables -> Actions -> Variables) override it:
#   ZETAPHY_RPC, FL_ROUNDS_ADDRESS
#   MODEL_EPOCHS_ADDRESS, GOV_BECH32, FL_ACTIVATION (also write proposal.json)
# Aggregating needs NO secret (public chain data; the pull request uses the built-in GITHUB_TOKEN).
# The manual `deploy` mode is the one job with a key: ZETAPHY_DEPLOYER_KEY, an existing secret that lives
# only in the `testnet-deploy` environment (main only, owner approves each run; docs/SECRETS-HARDENING.md).
# It deploys FederatedRounds CLOSED (paused), owned by the ZetaphyTimelock, and pushes the deployment
# record to the branch neuro-fl/deployment for a pull request; opening the contract is a separate
# timelock operation (zetaphy fl propose open). Only `propose` and `deploy` may write. Actions pinned by SHA.

name: Neuro FL

on:
  schedule:
    - cron: '43 5 * * 4' # Thursdays 05:43 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'aggregate (default) or deploy (testnet-deploy environment: FederatedRounds, closed, owned by the timelock)'
        required: false
        default: 'aggregate'
        type: choice
        options: [aggregate, deploy]
      round:
        description: 'Round to aggregate (empty = the last finished one)'
        required: false
        default: ''
  pull_request:
    paths: ['zetaphy-neuro/ml/fl/**', 'zetaphy-neuro/ml/model.json', 'zetaphy-neuro/ml/manifest.json',
            'zetaphy-network/contracts/ModelEpochs.sol', 'zetaphy-network/contracts/FederatedRounds.sol',
            'zetaphy-network/src/fl.js', 'zetaphy-network/src/flcli.js', 'zetaphy-network/src/modelepochs.js', 'zetaphy-network/scripts/fl-aggregate.js',
            'zetaphy-neuro/web/fl-*.js', 'zetaphy-neuro/test/fl.e2e.js',
            '.github/workflows/neuro-fl.yml']

permissions: {}

concurrency:
  group: neuro-fl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: FL + registry tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
        working-directory: zetaphy-network
      - run: npm ci --no-audit --no-fund
        working-directory: zetaphy-neuro
      - name: Neuro side (head, privacy, wire format, robust aggregation, gate, simulation, version selection)
        working-directory: zetaphy-neuro
        run: |
          node ml/fl/manifest.js --check
          node --test ml/test/fl.test.js ml/test/registry.test.js ml/test/flbrowser.test.js
      - name: Network side (ModelEpochs, FederatedRounds, envelopes, aggregator)
        working-directory: zetaphy-network
        run: node --test test/modelepochs.test.js test/federated.test.js test/flcli.test.js
      - name: Browser panel, a whole round with five browsers (Chromium from Playwright)
        working-directory: zetaphy-neuro
        run: |
          npx playwright-core install --with-deps chromium
          node --test ml/test/fl.browser.e2e.js test/fl.e2e.js

  aggregate:
    name: Aggregate a round
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'deploy')
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      better: ${{ steps.run.outputs.better }}
      head: ${{ steps.run.outputs.head }}
    defaults:
      run:
        working-directory: zetaphy-network
    env:
      ROUND: ${{ github.event.inputs.round }}
      RPC: ${{ vars.ZETAPHY_RPC }}
      ROUNDS: ${{ vars.FL_ROUNDS_ADDRESS }}
      REGISTRY: ${{ vars.MODEL_EPOCHS_ADDRESS }}
      GOV: ${{ vars.GOV_BECH32 }}
      ACTIVATION: ${{ vars.FL_ACTIVATION }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - name: Aggregate (deterministic; anyone can rerun it)
        id: run
        run: |
          set -euo pipefail
          A=(--inbox ../zetaphy-neuro/ml/fl/inbox --out out/fl)
          [ -n "$ROUND" ] && A+=(--round "$ROUND")
          [ -n "$RPC" ] && [ -n "$ROUNDS" ] && A+=(--rpc "$RPC" --rounds "$ROUNDS")
          [ -n "$REGISTRY" ] && [ -n "$GOV" ] && [ -n "$ACTIVATION" ] && A+=(--registry "$REGISTRY" --gov-bech32 "$GOV" --activation "$ACTIVATION" \
            --uri "https://raw.githubusercontent.com/${{ github.repository }}/main/zetaphy-neuro/ml/manifest.json")
          DEPLOYED=$(node -e 'const d=require("../zetaphy-neuro/ml/fl/deployment.json");console.log(/^0x[0-9a-fA-F]{40}$/.test(d.rounds??"")?"yes":"no")')
          if [ -z "$ROUND" ] && [ "$DEPLOYED" != yes ] && { [ -z "$RPC" ] || [ -z "$ROUNDS" ]; }; then echo "FederatedRounds is not deployed yet (zetaphy-neuro/ml/fl/deployment.json) and no round was given: nothing to do"; echo "better=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          node scripts/fl-aggregate.js "${A[@]}" | tee out.json
          echo "better=$(node -p "require('./out.json').better")" >> "$GITHUB_OUTPUT"
          echo "head=$(node -p "require('./out.json').candidate ?? ''")" >> "$GITHUB_OUTPUT"
          [ -f out/fl/body.md ] && cat out/fl/body.md >> "$GITHUB_STEP_SUMMARY" || cat out/fl/decision.json >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: neuro-fl-${{ github.run_id }}
          path: zetaphy-network/out/fl/
          retention-days: 30
          if-no-files-found: warn

  propose:
    name: Open PR with the candidate head
    needs: aggregate
    if: needs.aggregate.outputs.better == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: neuro-fl-${{ github.run_id }}
          path: artifact
      - name: Commit to a new branch and open a pull request (never the default branch)
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_ID: ${{ needs.aggregate.outputs.head }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          BRANCH="neuro-fl/head-$HEAD_ID"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then echo "branch $BRANCH exists already"; exit 0; fi
          cp artifact/head.json zetaphy-neuro/ml/fl/head.json
          cp artifact/manifest.json zetaphy-neuro/ml/manifest.json
          git config user.name "neuro-fl[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add zetaphy-neuro/ml/fl/head.json zetaphy-neuro/ml/manifest.json
          git commit -m "neuro-fl: candidate head $HEAD_ID" -m "Federated round aggregated by run ${{ github.run_id }}. Takes effect only after a governance vote schedules the manifest in the ModelEpochs."
          git push origin "$BRANCH"
          gh pr create --base "$BASE" --head "$BRANCH" --title "Neuro FL: candidate head $HEAD_ID" --body-file artifact/body.md

  deploy:
    name: Deploy FederatedRounds (testnet, closed, owned by the timelock)
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: testnet-deploy
    permissions:
      contents: write   # pushes the deployment record to neuro-fl/deployment (never the default branch)
    defaults:
      run:
        shell: bash
        working-directory: zetaphy-network
    env:
      ZETAPHY_RPC: https://rpc.sawasdeecoin.com
      DEPLOYER: "0x6af57fC3633dD0F7907f7900dbd4A2822F43a245"
      TIMELOCK: "0x731db92410B3b15Ae4b6b41E47fc3c9a66390340"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - name: Deploy (closed) and write the record
        env:
          KEY: ${{ secrets.ZETAPHY_DEPLOYER_KEY }}
        run: |
          set -o pipefail
          node -e 'const d=require("../zetaphy-neuro/ml/fl/deployment.json"); if (d.rounds) { console.error("::error::already deployed: " + d.rounds); process.exit(1); }'
          [ -n "$KEY" ] || { echo "::error::the secret ZETAPHY_DEPLOYER_KEY is not set in this job's environment (docs/SECRETS-HARDENING.md)"; exit 1; }
          k=$(printf '%s' "$KEY" | tr -d '[:space:]'); k=${k#0x}; echo "::add-mask::$k"; echo "::add-mask::0x$k"
          H="$RUNNER_TEMP/zh"; mkdir -p "$H"; umask 077; printf '0x%s' "$k" > "$H/worker.key"; unset k KEY
          trap 'rm -f "$H/worker.key"' EXIT
          [ "$(node -e 'console.log(new (require("ethers").Wallet)(require("fs").readFileSync(process.argv[1],"utf8").trim()).address)' "$H/worker.key")" = "$DEPLOYER" ] \
            || { echo "::error::ZETAPHY_DEPLOYER_KEY is not $DEPLOYER"; exit 1; }
          ZETAPHY_HOME="$H" node cli.js fl deploy --rpc "$ZETAPHY_RPC" --governance "$TIMELOCK" --out ../zetaphy-neuro/ml/fl/deployment.json | tee "$H/deploy.log"
          node cli.js fl propose open --timelock "$TIMELOCK" | tee -a "$GITHUB_STEP_SUMMARY"
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B neuro-fl/deployment
          git add zetaphy-neuro/ml/fl/deployment.json
          git commit -q -m "Neuro FL: FederatedRounds deployed on the testnet (closed)" -m "From ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Opening it is a timelock operation: zetaphy fl propose open."
          git push -q --force origin neuro-fl/deployment
          echo "open the pull request: ${{ github.server_url }}/${{ github.repository }}/compare/main...neuro-fl/deployment" | tee -a "$GITHUB_STEP_SUMMARY"
