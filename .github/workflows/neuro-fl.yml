# Neuro federated learning: aggregate one round of browser updates
# (zetaphy-neuro/ml/fl, docs/future/federated.md).
#
# Not a server: a scheduled job on the free Actions allowance (a minute or
# two a week). It reads the last finished round's revealed updates from the
# FederatedRounds contract (testnet) and any signed envelopes committed under
# zetaphy-neuro/ml/fl/inbox/round-N/, aggregates them with a coordinate-wise
# trimmed mean, runs the canary gate, and, only if the gate passes, opens a
# pull request with the candidate head and its manifest. The pull request is
# not the decision: the manifest hash takes effect only after a governance
# vote schedules it in the ModelEpochs from a future block height.
#
# No secrets: the RPC URL and contract addresses are repository VARIABLES
# (Settings -> Secrets and variables -> Actions -> Variables):
#   ZETAPHY_RPC, FL_ROUNDS_ADDRESS (both optional: without them only the inbox is read)
#   MODEL_EPOCHS_ADDRESS, GOV_BECH32, FL_ACTIVATION (optional: also write proposal.json)
# Only the `propose` job may write. Actions pinned by SHA.

name: Neuro FL

on:
  schedule:
    - cron: '43 5 * * 4' # Thursdays 05:43 UTC
  workflow_dispatch:
    inputs:
      round:
        description: 'Round to aggregate (empty = the last finished one)'
        required: false
        default: ''
  pull_request:
    paths: ['zetaphy-neuro/ml/fl/**', 'zetaphy-neuro/ml/model.json', 'zetaphy-neuro/ml/manifest.json',
            'zetaphy-network/contracts/ModelEpochs.sol', 'zetaphy-network/contracts/FederatedRounds.sol',
            'zetaphy-network/src/fl.js', 'zetaphy-network/src/modelepochs.js', 'zetaphy-network/scripts/fl-aggregate.js',
            '.github/workflows/neuro-fl.yml']

permissions: {}

concurrency:
  group: neuro-fl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: FL + registry tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
        working-directory: zetaphy-network
      - run: npm ci --no-audit --no-fund
        working-directory: zetaphy-neuro
      - name: Neuro side (head, privacy, wire format, robust aggregation, gate, simulation, version selection)
        working-directory: zetaphy-neuro
        run: |
          node ml/fl/manifest.js --check
          node --test ml/test/fl.test.js ml/test/registry.test.js
      - name: Network side (ModelEpochs, FederatedRounds, envelopes, aggregator)
        working-directory: zetaphy-network
        run: node --test test/modelepochs.test.js test/federated.test.js

  aggregate:
    name: Aggregate a round
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      better: ${{ steps.run.outputs.better }}
      head: ${{ steps.run.outputs.head }}
    defaults:
      run:
        working-directory: zetaphy-network
    env:
      ROUND: ${{ github.event.inputs.round }}
      RPC: ${{ vars.ZETAPHY_RPC }}
      ROUNDS: ${{ vars.FL_ROUNDS_ADDRESS }}
      REGISTRY: ${{ vars.MODEL_EPOCHS_ADDRESS }}
      GOV: ${{ vars.GOV_BECH32 }}
      ACTIVATION: ${{ vars.FL_ACTIVATION }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - name: Aggregate (deterministic; anyone can rerun it)
        id: run
        run: |
          set -euo pipefail
          A=(--inbox ../zetaphy-neuro/ml/fl/inbox --out out/fl)
          [ -n "$ROUND" ] && A+=(--round "$ROUND")
          [ -n "$RPC" ] && [ -n "$ROUNDS" ] && A+=(--rpc "$RPC" --rounds "$ROUNDS")
          [ -n "$REGISTRY" ] && [ -n "$GOV" ] && [ -n "$ACTIVATION" ] && A+=(--registry "$REGISTRY" --gov-bech32 "$GOV" --activation "$ACTIVATION" \
            --uri "https://raw.githubusercontent.com/${{ github.repository }}/main/zetaphy-neuro/ml/manifest.json")
          if [ -z "$ROUND" ] && { [ -z "$RPC" ] || [ -z "$ROUNDS" ]; }; then echo "no round given and no chain configured: nothing to do"; echo "better=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          node scripts/fl-aggregate.js "${A[@]}" | tee out.json
          echo "better=$(node -p "require('./out.json').better")" >> "$GITHUB_OUTPUT"
          echo "head=$(node -p "require('./out.json').candidate ?? ''")" >> "$GITHUB_OUTPUT"
          [ -f out/fl/body.md ] && cat out/fl/body.md >> "$GITHUB_STEP_SUMMARY" || cat out/fl/decision.json >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: neuro-fl-${{ github.run_id }}
          path: zetaphy-network/out/fl/
          retention-days: 30
          if-no-files-found: warn

  propose:
    name: Open PR with the candidate head
    needs: aggregate
    if: needs.aggregate.outputs.better == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: neuro-fl-${{ github.run_id }}
          path: artifact
      - name: Commit to a new branch and open a pull request (never the default branch)
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_ID: ${{ needs.aggregate.outputs.head }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          BRANCH="neuro-fl/head-$HEAD_ID"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then echo "branch $BRANCH exists already"; exit 0; fi
          cp artifact/head.json zetaphy-neuro/ml/fl/head.json
          cp artifact/manifest.json zetaphy-neuro/ml/manifest.json
          git config user.name "neuro-fl[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add zetaphy-neuro/ml/fl/head.json zetaphy-neuro/ml/manifest.json
          git commit -m "neuro-fl: candidate head $HEAD_ID" -m "Federated round aggregated by run ${{ github.run_id }}. Takes effect only after a governance vote schedules the manifest in the ModelEpochs."
          git push origin "$BRANCH"
          gh pr create --base "$BASE" --head "$BRANCH" --title "Neuro FL: candidate head $HEAD_ID" --body-file artifact/body.md
