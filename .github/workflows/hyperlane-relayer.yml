# ZETAPHY Saphan, EVM route: the Hyperlane relayer on GitHub Actions (until a server runs it all
# the time with zetaphy-chain/hyperlane/setup-agents.sh). Every 15 minutes it runs the pinned
# relayer for about 8 minutes: Sepolia -> ZETAPHY messages from our HyperlaneLockBox are
# delivered to the HyperlaneLane on ZETAPHY (the ZETAPHY Mailbox's ISM checks Hyperlane's
# Sepolia validator signature). It relays nothing else (whitelist: that lockbox, that route),
# so its key spends nothing on Sepolia. Its database is kept between runs in the Actions cache.
#
# Delivery takes about 5-30 minutes. Starts only once zetaphy-chain/hyperlane/bridge-testnet.json
# (written by the bridge-testnet deploy) is on main.
# Signer: the repository secret ZETAPHY_DEPLOYER_KEY (it keeps no role; it only pays ZETAPHY gas, which is 0).
# Cost: free (GitHub-hosted runner, public repository).

name: hyperlane-relayer

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: hyperlane-relayer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  relay:
    name: Hyperlane relayer (Sepolia -> ZETAPHY)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      # ghcr.io/hyperlane-xyz/hyperlane-agent:agents-v2.3.0 (the same digest as setup-agents.sh)
      IMAGE: ghcr.io/hyperlane-xyz/hyperlane-agent@sha256:6414aecfdc1b6ea2e364019f672004c113c2a347dd4d1343aa856921d1e0a685
      CONFIG: zetaphy-chain/hyperlane/agent-config.json
      BRIDGE: zetaphy-chain/hyperlane/bridge-testnet.json
      RUN_SECONDS: '480'
      SEPOLIA_RPC: https://ethereum-sepolia-rpc.publicnode.com
    steps:
      - uses: actions/checkout@v5

      - name: Bridge deployed?
        id: b
        run: |
          if [ ! -f "$BRIDGE" ]; then echo "no $BRIDGE yet: nothing to relay"; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          lockbox=$(jq -r .sepolia.hyperlaneLockBox "$BRIDGE"); tx=$(jq -r .sepolia.deployTx "$BRIDGE"); zfrom=$(jq -r '.zetaphy.fromBlock // empty' "$BRIDGE")
          [[ "$lockbox" =~ ^0x[0-9a-fA-F]{40}$ && "$tx" =~ ^0x[0-9a-fA-F]{64}$ ]] || { echo "::error::$BRIDGE lacks the lockbox or its deploy tx"; exit 1; }
          sfrom=$(( $(curl -fsS --max-time 30 -H 'content-type: application/json' --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_getTransactionReceipt\",\"params\":[\"$tx\"]}" "$SEPOLIA_RPC" | jq -r .result.blockNumber) ))
          { echo "go=yes"; echo "lockbox=$lockbox"; echo "sfrom=$sfrom"; echo "zfrom=$zfrom"; } >> "$GITHUB_OUTPUT"
          echo "relaying messages from $lockbox (Sepolia, from block $sfrom) to ZETAPHY"

      - name: Restore the relayer database
        if: steps.b.outputs.go == 'yes'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/relayer-db
          key: hyperlane-relayer-db-${{ github.run_id }}
          restore-keys: hyperlane-relayer-db-

      - name: Run the relayer
        if: steps.b.outputs.go == 'yes'
        env:
          KEY: ${{ secrets.ZETAPHY_DEPLOYER_KEY }}
          LOCKBOX: ${{ steps.b.outputs.lockbox }}
          SFROM: ${{ steps.b.outputs.sfrom }}
          ZFROM: ${{ steps.b.outputs.zfrom }}
        run: |
          [ -n "$KEY" ] || { echo "::error::the repository secret ZETAPHY_DEPLOYER_KEY is not set"; exit 1; }
          k=$(printf '%s' "$KEY" | tr -d '[:space:]'); k=${k#0x}; echo "::add-mask::$k"; echo "::add-mask::0x$k"
          DB="$RUNNER_TEMP/relayer-db"; mkdir -p "$DB"; sudo chown -R 10391:10391 "$DB"
          ENVF="$RUNNER_TEMP/relayer.env"; umask 077
          {
            echo "CONFIG_FILES=/config/agent-config.json"
            echo "HYP_RELAYCHAINS=sepolia,zetaphy"
            echo "HYP_DB=/data"
            echo "HYP_DEFAULTSIGNER_TYPE=hexKey"
            echo "HYP_DEFAULTSIGNER_KEY=0x$k"
            echo 'HYP_GASPAYMENTENFORCEMENT=[{"type":"none"}]'
            # Hyperlane addresses are 32 bytes: the lockbox left-padded with zeros
            echo "HYP_WHITELIST=[{\"originDomain\":11155111,\"senderAddress\":\"0x000000000000000000000000$(echo "${LOCKBOX#0x}" | tr 'A-F' 'a-f')\",\"destinationDomain\":77390}]"
            echo "HYP_CHAINS_SEPOLIA_INDEX_FROM=$SFROM"
            echo "HYP_CHAINS_ZETAPHY_INDEX_CHUNK=499"
            [ -n "$ZFROM" ] && echo "HYP_CHAINS_ZETAPHY_INDEX_FROM=$ZFROM"
            echo "HYP_METRICSPORT=9091"
            echo "HYP_LOG_FORMAT=pretty"
            echo "HYP_LOG_LEVEL=info"
          } > "$ENVF"
          unset k KEY
          docker pull -q "$IMAGE"
          set +e
          timeout "$RUN_SECONDS" docker run --rm --name hyp-relayer --user 10391:10391 --cap-drop ALL --security-opt no-new-privileges \
            --env-file "$ENVF" -v "$GITHUB_WORKSPACE/$CONFIG:/config/agent-config.json:ro" -v "$DB:/data" \
            "$IMAGE" ./relayer > "$RUNNER_TEMP/relayer.log" 2>&1
          code=$?
          set -e
          rm -f "$ENVF"
          docker rm -f hyp-relayer >/dev/null 2>&1 || true
          # 124 = stopped by timeout, the normal end of a run
          [ "$code" = 124 ] || { tail -60 "$RUNNER_TEMP/relayer.log"; echo "::error::the relayer exited early (code $code)"; exit 1; }
          sudo chown -R "$(id -u):$(id -g)" "$DB"

      - name: What this run did
        if: always() && steps.b.outputs.go == 'yes'
        run: |
          L="$RUNNER_TEMP/relayer.log"; [ -f "$L" ] || exit 0
          d=$(grep -ci 'delivered\|Message processed' "$L" || true); e=$(grep -c ' ERROR ' "$L" || true)
          echo "deliveries in the log: $d, errors: $e"
          grep -iE 'delivered|Message processed| ERROR ' "$L" | tail -20 || true
          { echo "### Hyperlane relayer"; echo "deliveries in the log: $d, errors: $e"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the relayer database
        if: always() && steps.b.outputs.go == 'yes'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/relayer-db
          key: hyperlane-relayer-db-${{ github.run_id }}
