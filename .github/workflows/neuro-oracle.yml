# Neuro cross-chain security oracle (docs/future/crosschain-assist.md, item 18), saphan-route style, testnets only:
#   ZETAPHY:      NeuroOracleSender (reads ThreatRegistry + NeuroJobs, sends through ZETAPHY's Hyperlane Mailbox)
#   each chain:   NeuroOracle (the mirror DEXes query), its ISM = OUR validators' multisig ISM for origin ZETAPHY
#                 (the same as the Saphan lockboxes), governance = the chain's v2 timelock, guardian = its multisig
# The chains come from zetaphy-chain/hyperlane/saphan-chains.json.
#
# mode = check    read only: the chain's Mailbox, our ISM's address there, the deployer's balance and nonce
# mode = dry_run  the whole flow on LOCAL chains (an anvil fork of the chain with its real Mailbox and ISM factory,
#                 a fresh local ZETAPHY with Hyperlane core from the pinned CLI), throwaway validator keys:
#                 flag on ZETAPHY -> push -> process on the chain -> NeuroOracle.check(token); prints NEURO ORACLE DRY RUN OK.
#                 No secret, no ZETAPHY RPC.
# There is NO deploy mode yet: the testnet deploy is planned after 2026-11-01 (the commands are
# scripts/neuro-oracle.js sender | receiver | wire; the doc lists the steps). Cost: free (GitHub-hosted runner).

name: neuro-oracle

on:
  pull_request:
    paths:
      - '.github/workflows/neuro-oracle.yml'
      - 'zetaphy-network/contracts/NeuroOracle.sol'
      - 'zetaphy-network/scripts/neuro-oracle.js'
      - 'zetaphy-network/src/neurooracle.js'
  workflow_dispatch:
    inputs:
      chain:
        description: "the chain (a name in zetaphy-chain/hyperlane/saphan-chains.json)"
        required: true
        default: 'basesepolia'
        type: choice
        options: ['sepolia', 'basesepolia', 'arbitrumsepolia']
      mode:
        description: "check = read only; dry_run = on local chains"
        required: true
        default: 'check'
        type: choice
        options: ['check', 'dry_run']

permissions:
  contents: read

jobs:
  oracle:
    name: Neuro oracle ${{ matrix.chain }} (testnet, ${{ github.event_name == 'pull_request' && 'dry_run' || inputs.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        chain: ${{ github.event_name == 'pull_request' && fromJSON('["basesepolia"]') || fromJSON(format('["{0}"]', inputs.chain)) }}
    defaults:
      run:
        shell: bash
        working-directory: zetaphy-network
    env:
      MODE: ${{ github.event_name == 'pull_request' && 'dry_run' || inputs.mode }}
      CHAIN: ${{ matrix.chain }}
      HYP_CLI: "@hyperlane-xyz/cli@45.0.1"
      DEPLOYER: "0x6af57fC3633dD0F7907f7900dbd4A2822F43a245"
      # anvil's well-known dev key #0 (public, dry run only)
      DEV_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund

      - name: The chain table entry
        id: t
        run: |
          node -e 'import("./src/saphan.js").then(({ loadChains, chainOf }) => { const c = chainOf(loadChains(), process.env.CHAIN); console.log(`rpc=${c.rpc.join(",")}`); })' | tee -a "$GITHUB_OUTPUT"

      - name: Check the chain (read only)
        if: env.MODE == 'check'
        env:
          ORIGIN_RPC: ${{ steps.t.outputs.rpc }}
        run: node scripts/neuro-oracle.js check --chain "$CHAIN" | tail -1 | jq .

      - name: Install anvil (pinned)
        if: env.MODE == 'dry_run'
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.2.3

      - name: Dry run on local chains (a fork of the chain, a fresh ZETAPHY with Hyperlane core)
        if: env.MODE == 'dry_run'
        env:
          ORIGIN_URL: ${{ steps.t.outputs.rpc }}
        run: |
          set -o pipefail
          W=$(mktemp -d)
          # fork a few blocks behind the head: a load-balanced public RPC may not have the newest block yet ("block not found")
          FORK_URL="${ORIGIN_URL%%,*}"
          HEAD=$(curl -fsS --max-time 30 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' "$FORK_URL" | jq -r .result)
          anvil --fork-url "$FORK_URL" --fork-block-number $(( HEAD - 12 )) --retries 10 --fork-retry-backoff 2000 --port 8601 --silent &
          anvil --chain-id 77390 --port 8602 --silent &
          for port in 8601 8602; do for _ in $(seq 1 60); do curl -fs -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' 127.0.0.1:$port >/dev/null && break; sleep 2; done; done
          npm i -g --no-audit --no-fund "$HYP_CLI"
          mkdir -p "$W/reg/chains/zetaphy"
          sed 's#https://rpc.sawasdeecoin.com#http://127.0.0.1:8602#' ../zetaphy-chain/hyperlane/registry/chains/zetaphy/metadata.yaml > "$W/reg/chains/zetaphy/metadata.yaml"
          DEV=$(node -e 'console.log(new (require("ethers").Wallet)(process.argv[1]).address)' "$DEV_KEY")
          printf 'owner: "%s"\ndefaultIsm:\n  type: testIsm\ndefaultHook:\n  type: merkleTreeHook\nrequiredHook:\n  type: protocolFee\n  owner: "%s"\n  beneficiary: "%s"\n  protocolFee: "0"\n  maxProtocolFee: "1000000000"\n' "$DEV" "$DEV" "$DEV" > "$W/core.yaml"
          HYP_KEY="$DEV_KEY" hyperlane core deploy --chain zetaphy --config "$W/core.yaml" -r "$W/reg" --yes > "$W/core.log" 2>&1 || { tail -40 "$W/core.log"; exit 1; }
          export ORIGIN_RPC=http://127.0.0.1:8601 ZETAPHY_RPC=http://127.0.0.1:8602 ZETAPHY_CORE="$W/reg/chains/zetaphy/addresses.yaml"
          node scripts/saphan-dryrun.js --chain "$CHAIN" --neuro-oracle | tee "$W/dry.log"
          grep -q '^NEURO ORACLE DRY RUN OK' "$W/dry.log"
