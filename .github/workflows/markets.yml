# Risk forecasts keeper + evolving detectors (docs/future/markets.md). TESTNET ONLY.
#
# Not a server: scheduled jobs on the free Actions allowance.
#   keeper  (hourly): pokes open risk-forecast questions, proposes answers from chain facts,
#           finalizes undisputed ones (zetaphy-network/scripts/markets.js keeper). Runs only when the
#           repository variable RISK_FORECASTS holds the contract address; sends only when the secret
#           MARKETS_KEY (a testnet key with a little testnet ZETAPHY for gas) is set, else a dry run.
#   evolve  (weekly): breeds new detector variants from the best living organisms (DetectorPool, read
#           with DETECTOR_POOL) or the seed spec, on the synthetic corpus; a child is kept only if it
#           beats its parent on held-out rows. The children are uploaded as an artifact.
#   detectors (every 6 hours): the whole evolving-detector loop, automated (zetaphy-network/src/detectorloop.js,
#           `markets.js detectors-round`): once per DetectorPool round it breeds children that beat their parent
#           on held-out labelled rows and registers them; every pass it commits forecasts for open RiskForecasts
#           events (features read with Neuro from ZETAPHY), reveals them after the deadline (p recovered from
#           the commitment with the key-derived salt: nothing stored), scores resolved events and settles the
#           pool round. New specs are pushed to the branch detectors/population (their URI). Runs when the
#           variables DETECTOR_POOL and FORESIGHT are set (RISK_FORECASTS for events); sends only when
#           DETECTORS_SUBMIT is 'on', otherwise a dry run that writes the plan. Environment testnet-automation,
#           secret MARKETS_KEY (docs/SECRETS-HARDENING.md). Deterministic: the manifest (an artifact) lists the
#           inputs' hashes, the seed, parents, children and every prediction; checkManifest re-derives them.
# Actions pinned by SHA; the key goes to a 0600 file, is masked, and never printed.

name: Markets

on:
  schedule:
    - cron: '23 * * * *'   # keeper, hourly
    - cron: '43 5 * * 2'   # evolve, Tuesdays 05:43 UTC
    - cron: '53 */6 * * *' # detectors loop, every 6 hours
  workflow_dispatch:
    inputs:
      job:
        description: 'keeper, evolve or detectors'
        required: true
        default: 'keeper'

permissions: {}

concurrency:
  group: markets-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

env:
  ZETAPHY_RPC: https://rpc.sawasdeecoin.com

jobs:
  keeper:
    if: (github.event.schedule == '23 * * * *' || inputs.job == 'keeper') && vars.RISK_FORECASTS != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: zetaphy-network
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - name: Load the testnet key (if set)
        env:
          KEY: ${{ secrets.MARKETS_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "SEND=" >> "$GITHUB_ENV"; exit 0; fi
          k=$(printf '%s' "$KEY" | tr -d '[:space:]'); k=${k#0x}; echo "::add-mask::$k"; echo "::add-mask::0x$k"
          H="$RUNNER_TEMP/mk"; mkdir -p "$H"; umask 077; printf '0x%s' "$k" > "$H/k"; unset k KEY
          echo "KEYFILE=$H/k" >> "$GITHUB_ENV"; echo "SEND=--send" >> "$GITHUB_ENV"
      - name: Keeper
        env:
          RISK_FORECASTS: ${{ vars.RISK_FORECASTS }}
        run: node scripts/markets.js keeper --forecasts "$RISK_FORECASTS" $SEND
      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/mk/k"

  evolve:
    if: github.event.schedule == '43 5 * * 2' || inputs.job == 'evolve'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
        working-directory: zetaphy-neuro
      - run: npm ci --no-audit --no-fund
        working-directory: zetaphy-network
      - name: Parents (best living organisms, else the seed population)
        env:
          DETECTOR_POOL: ${{ vars.DETECTOR_POOL }}
        run: |
          if [ -n "$DETECTOR_POOL" ]; then
            node zetaphy-network/scripts/markets.js detectors-parents --pool "$DETECTOR_POOL" --dir zetaphy-neuro/ml/detectors/population --out "$RUNNER_TEMP/parents.json" || true
          fi
          if [ ! -s "$RUNNER_TEMP/parents.json" ] || [ "$(jq length "$RUNNER_TEMP/parents.json")" = 0 ]; then
            node -e 'const fs=require("fs");const d="zetaphy-neuro/ml/detectors/population";fs.writeFileSync(process.argv[1],JSON.stringify(fs.readdirSync(d).filter(f=>f.endsWith(".json")).map(f=>({organism:0,spec:JSON.parse(fs.readFileSync(d+"/"+f,"utf8"))}))))' "$RUNNER_TEMP/parents.json"
          fi
      - name: Labelled rows (synthetic corpus + recorded red-team evasions)
        working-directory: zetaphy-neuro
        run: node ml/data/build-corpus.js --per-family 30 --dispatch 300
      - name: Breed
        working-directory: zetaphy-neuro
        run: |
          node ml/detectors/mutate.js --parents "$RUNNER_TEMP/parents.json" --rows ml/data/out/corpus.jsonl,ml/data/redteam/evasions.jsonl \
            --round "$(date -u +%G%V)" --n 6 --out "$RUNNER_TEMP/detectors"
          cat "$RUNNER_TEMP/detectors/summary.json" | jq '{round, heldRows, children: [.children[] | {name, specHash, brierHeld, parentHeld}]}' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: detectors
          path: ${{ runner.temp }}/detectors

  detectors:
    if: (github.event.schedule == '53 */6 * * *' || inputs.job == 'detectors') && vars.DETECTOR_POOL != '' && vars.FORESIGHT != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: testnet-automation
    permissions:
      contents: write   # the branch detectors/population only
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
        working-directory: zetaphy-neuro
      - run: npm ci --no-audit --no-fund
        working-directory: zetaphy-network
      - name: Population (committed seed + the published specs)
        run: |
          P="$RUNNER_TEMP/population"; mkdir -p "$P"; cp zetaphy-neuro/ml/detectors/population/*.json "$P"/
          if git fetch -q origin detectors/population 2>/dev/null; then
            git archive origin/detectors/population zetaphy-neuro/ml/detectors/population | tar -x -C "$RUNNER_TEMP" && cp "$RUNNER_TEMP"/zetaphy-neuro/ml/detectors/population/*.json "$P"/ || true
          fi
          echo "POP=$P" >> "$GITHUB_ENV"; ls "$P" | wc -l
      - name: Labelled rows (synthetic corpus + recorded red-team evasions; curated held-out set if committed)
        working-directory: zetaphy-neuro
        run: |
          node ml/data/build-corpus.js --per-family 30 --dispatch 300
          echo "ROWS=$PWD/ml/data/out/corpus.jsonl,$PWD/ml/data/redteam/evasions.jsonl" >> "$GITHUB_ENV"
          if [ -s ml/detectors/held-out.jsonl ]; then echo "HELD=--held $PWD/ml/detectors/held-out.jsonl" >> "$GITHUB_ENV"; else echo "HELD=" >> "$GITHUB_ENV"; fi
      - name: Load the testnet key
        env:
          KEY: ${{ secrets.MARKETS_KEY }}
          SUBMIT: ${{ vars.DETECTORS_SUBMIT }}
        run: |
          [ -n "$KEY" ] || { echo "no MARKETS_KEY in this environment: nothing to do (the salts need the key)"; echo "NOKEY=1" >> "$GITHUB_ENV"; exit 0; }
          k=$(printf '%s' "$KEY" | tr -d '[:space:]'); k=${k#0x}; echo "::add-mask::$k"; echo "::add-mask::0x$k"
          H="$RUNNER_TEMP/mk"; mkdir -p "$H"; umask 077; printf '0x%s' "$k" > "$H/k"; unset k KEY
          echo "KEYFILE=$H/k" >> "$GITHUB_ENV"
          if [ "$SUBMIT" = on ]; then echo "SEND=--send" >> "$GITHUB_ENV"; else echo "SEND=" >> "$GITHUB_ENV"; fi
      - name: One pass of the loop
        if: env.NOKEY != '1'
        env:
          DETECTOR_POOL: ${{ vars.DETECTOR_POOL }}
          FORESIGHT: ${{ vars.FORESIGHT }}
          RISK_FORECASTS: ${{ vars.RISK_FORECASTS }}
        run: |
          node zetaphy-network/scripts/markets.js detectors-round --pool "$DETECTOR_POOL" --foresight "$FORESIGHT" ${RISK_FORECASTS:+--forecasts "$RISK_FORECASTS"} \
            --dir "$POP" --rows "$ROWS" $HELD --n 6 --stake 1 \
            --uri-base "https://raw.githubusercontent.com/${{ github.repository }}/detectors/population/zetaphy-neuro/ml/detectors/population" \
            --out "$RUNNER_TEMP/detectors/manifest.json" $SEND | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish new specs (content-addressed) on detectors/population
        if: env.NOKEY != '1' && env.SEND == '--send'
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin detectors/population && git checkout -q -B detectors/population origin/detectors/population || git checkout -q -B detectors/population
          cp "$POP"/*.json zetaphy-neuro/ml/detectors/population/
          git add zetaphy-neuro/ml/detectors/population
          git diff --cached --quiet || { git commit -q -m "detectors: round $(jq .round "$RUNNER_TEMP/detectors/manifest.json")" && git push -q origin detectors/population; }
      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/mk/k"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.NOKEY != '1'
        with:
          name: detectors-round
          path: ${{ runner.temp }}/detectors
