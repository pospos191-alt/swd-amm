# ZETAPHY Saphan, EVM route: deploy Hyperlane core (Mailbox, ISMs, hooks,
# ValidatorAnnounce, ProxyAdmin) on the ZETAPHY testnet with the pinned
# @hyperlane-xyz/cli, then push the addresses and the agent config to the
# branch hyperlane/testnet. Run by hand only (Actions -> hyperlane-core -> Run workflow).
#
# Config: zetaphy-chain/hyperlane/core-config.yaml (every owner is the ZETAPHY
# timelock; Sepolia -> ZETAPHY trusts Hyperlane's own Sepolia validator) and
# zetaphy-chain/hyperlane/registry/chains/zetaphy/metadata.yaml.
# dry_run = yes deploys the same config on a throwaway local chain (chain id 77390)
# in the runner: nothing is sent to the testnet and no key is used.
# Once registry/chains/zetaphy/addresses.yaml is in the repo the core is never deployed
# again: a run then only finishes the setup (owner checks, the interchain account
# router handed to the timelock, the agent config).
#
# The deployer key is ZETAPHY_DEPLOYER_KEY of the environment testnet-deploy (the launch key: it
# only pays gas here, gas is 0 on the testnet, and it keeps no role). It is passed to
# the CLI as HYP_KEY and masked in logs.
# Cost: free (GitHub-hosted runner, public repository).

name: hyperlane-core

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "yes = check on a local throwaway chain only; no = act on the ZETAPHY testnet"
        required: true
        default: 'yes'
        type: choice
        options: ['yes', 'no']

# Least privilege: read-only by default; only the deploy job (environment testnet-deploy: required
# reviewer + main only, docs/SECRETS-HARDENING.md) gets ZETAPHY_DEPLOYER_KEY and write access.
permissions:
  contents: read

jobs:
  dry-run:
    name: Hyperlane core on ZETAPHY (dry run, local chain)
    if: inputs.dry_run == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      HYP_CLI: "@hyperlane-xyz/cli@45.0.1"
      DIR: zetaphy-chain/hyperlane
      BRANCH: hyperlane/testnet
      RPC: https://rpc.sawasdeecoin.com
      TIMELOCK: "0x731db92410B3b15Ae4b6b41E47fc3c9a66390340"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install the pinned Hyperlane CLI
        run: npm i -g --no-audit --no-fund "$HYP_CLI" && hyperlane --version

      - name: Dry run on a local chain (chain id 77390)
        env:
          GH_AUTH_TOKEN: ${{ github.token }}   # the CLI reads Sepolia from the GitHub registry
        run: |
          W=$(mktemp -d); cd "$W"
          npm i --silent --no-audit --no-fund hardhat@2.22.17
          printf 'module.exports={networks:{hardhat:{chainId:77390}}};\n' > hardhat.config.js
          npx hardhat node --port 18545 > node.log 2>&1 &
          for _ in $(seq 1 30); do curl -fs -X POST -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:18545 >/dev/null && break; sleep 1; done
          mkdir -p reg/chains/zetaphy
          sed 's#https://rpc.sawasdeecoin.com#http://127.0.0.1:18545#' "$GITHUB_WORKSPACE/$DIR/registry/chains/zetaphy/metadata.yaml" > reg/chains/zetaphy/metadata.yaml
          # hardhat's well-known test key #0 (public, holds only local test ETH)
          HYP_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 \
            hyperlane core deploy --chain zetaphy --config "$GITHUB_WORKSPACE/$DIR/core-config.yaml" \
            -r https://github.com/hyperlane-xyz/hyperlane-registry -r "$W/reg" --yes
          printf 'interchainGasPaymaster: "0x0000000000000000000000000000000000000000"\n' >> reg/chains/zetaphy/addresses.yaml
          hyperlane registry agent-config --chains sepolia zetaphy --out "$W/agent-config.json" \
            -r https://github.com/hyperlane-xyz/hyperlane-registry -r "$W/reg" --yes
          jq '.chains.zetaphy.mailbox' "$W/agent-config.json"
          echo "dry run OK: nothing was sent to the testnet"

  deploy:
    name: Hyperlane core on ZETAPHY
    if: inputs.dry_run == 'no'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: testnet-deploy
    permissions:
      contents: write        # pushes hyperlane/testnet
      pull-requests: write   # opens its pull request
    defaults:
      run:
        shell: bash
    env:
      HYP_CLI: "@hyperlane-xyz/cli@45.0.1"
      DIR: zetaphy-chain/hyperlane
      BRANCH: hyperlane/testnet
      RPC: https://rpc.sawasdeecoin.com
      TIMELOCK: "0x731db92410B3b15Ae4b6b41E47fc3c9a66390340"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install the pinned Hyperlane CLI
        run: npm i -g --no-audit --no-fund "$HYP_CLI" && hyperlane --version

      - name: Deployed already?
        id: state
        run: |
          if [ -f "$DIR/registry/chains/zetaphy/addresses.yaml" ]; then
            echo "deployed=yes" >> "$GITHUB_OUTPUT"; echo "core already deployed: finishing the setup only"
          else echo "deployed=no" >> "$GITHUB_OUTPUT"; fi

      - name: Check the RPC is ZETAPHY (eth_chainId 0x12e4e) before the key is used
        if: inputs.dry_run == 'no'
        run: |
          got=$(curl -fsS --max-time 30 -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' "$RPC" | jq -r '.result // empty')
          [ "$got" = "0x12e4e" ] || { echo "::error::the RPC answers eth_chainId '$got', not 0x12e4e: nothing is signed"; exit 1; }

      - name: Write the deployer key to a private file
        if: inputs.dry_run == 'no'
        env:
          KEY: ${{ secrets.ZETAPHY_DEPLOYER_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "::error::the secret ZETAPHY_DEPLOYER_KEY is not set in this job's environment (docs/SECRETS-HARDENING.md)"; exit 1; }
          k=$(printf '%s' "$KEY" | tr -d '[:space:]'); k=${k#0x}
          echo "::add-mask::$k"; echo "::add-mask::0x$k"
          umask 077; printf '0x%s' "$k" > "$RUNNER_TEMP/deployer.key"

      - name: Deploy core on the ZETAPHY testnet
        if: inputs.dry_run == 'no' && steps.state.outputs.deployed == 'no'
        env:
          GH_AUTH_TOKEN: ${{ github.token }}
        run: |
          HYP_KEY="$(cat "$RUNNER_TEMP/deployer.key")" hyperlane core deploy --chain zetaphy --config "$DIR/core-config.yaml" \
            -r https://github.com/hyperlane-xyz/hyperlane-registry -r "$DIR/registry" --yes
          # ZETAPHY has no interchain gas paymaster (gas is 0): the agent config needs the field
          printf 'interchainGasPaymaster: "0x0000000000000000000000000000000000000000"\n' >> "$DIR/registry/chains/zetaphy/addresses.yaml"

      - name: Owners on chain; hand the interchain account router to the timelock
        if: inputs.dry_run == 'no'
        run: |
          W=$(mktemp -d); (cd "$W" && npm i --silent --no-audit --no-fund ethers@6.16.0 yaml@2.8.1)
          NODE_PATH="$W/node_modules" KEYFILE="$RUNNER_TEMP/deployer.key" ADDR="$DIR/registry/chains/zetaphy/addresses.yaml" node -e '
          const { JsonRpcProvider, Wallet, Contract } = require("ethers"); const YAML = require("yaml"); const fs = require("fs");
          (async () => {
            const a = YAML.parse(fs.readFileSync(process.env.ADDR, "utf8"));
            const p = new JsonRpcProvider(process.env.RPC); const tl = process.env.TIMELOCK.toLowerCase();
            const own = (x) => new Contract(x, ["function owner() view returns (address)", "function transferOwnership(address)"], p);
            const mb = new Contract(a.mailbox, ["function defaultIsm() view returns (address)", "function requiredHook() view returns (address)"], p);
            const items = { mailbox: a.mailbox, proxyAdmin: a.proxyAdmin, defaultIsm: await mb.defaultIsm(), requiredHook: await mb.requiredHook(), interchainAccountRouter: a.interchainAccountRouter };
            const w = new Wallet(fs.readFileSync(process.env.KEYFILE, "utf8").trim(), p);
            let bad = 0;
            for (const [name, addr] of Object.entries(items)) {
              let o = (await own(addr).owner()).toLowerCase();
              if (o === w.address.toLowerCase()) {
                console.log(`${name} ${addr}: owned by the deployer, handing it to the timelock`);
                await (await own(addr).connect(w).transferOwnership(process.env.TIMELOCK)).wait();
                o = (await own(addr).owner()).toLowerCase();
              }
              console.log(`${name} ${addr} owner ${o}${o === tl ? " (timelock)" : ""}`);
              if (o !== tl) bad++;
            }
            if (bad) { console.error(`::error::${bad} contract(s) not owned by the timelock`); process.exit(1); }
          })().catch((e) => { console.error(e.shortMessage || e.message); process.exit(1); });'

      - name: Agent config (relayer, validator)
        if: inputs.dry_run == 'no'
        env:
          GH_AUTH_TOKEN: ${{ github.token }}
        run: |
          hyperlane registry agent-config --chains sepolia zetaphy --out "$DIR/agent-config.json" \
            -r https://github.com/hyperlane-xyz/hyperlane-registry -r "$DIR/registry" --yes
          jq '.chains.zetaphy | {mailbox, index}' "$DIR/agent-config.json"

      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/deployer.key"

      - name: Push the addresses to hyperlane/testnet
        if: inputs.dry_run == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B "$BRANCH"
          git add -- "$DIR/registry/chains/zetaphy/addresses.yaml" "$DIR/agent-config.json"
          if git diff --cached --name-only | grep -Eiq '(\.key|keystore|secret)'; then echo "::error::refusing to commit a key-like file"; exit 1; fi
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -q -m "zetaphy-chain/hyperlane: core on the ZETAPHY testnet (addresses, agent config)" -m "From ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          git push -q --force origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "Hyperlane core on the ZETAPHY testnet: addresses and agent config" \
            --body "Written by the hyperlane-core workflow ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))." \
            || echo "::warning::open the pull request by hand: ${{ github.server_url }}/${{ github.repository }}/compare/main...$BRANCH"
