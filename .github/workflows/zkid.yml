# Private identity (zetaphy-network/zkid, docs/future/zk-identity.md).
#
# Checks the committed pieces against each other, with no new trusted setup: the generated Poseidon copies
# (zetaphy-hub/zkid-poseidon.js, contracts/PoseidonT3.sol) are what circomlib's constants give; the circuit tests prove
# and verify with the prover files the hub ships (zetaphy-hub/zkid/, sha256 in its manifest) and refuse every false
# statement; the circuit source still compiles to the same constraint count; then the contract test replays the
# committed proofs on the real contracts. Nothing is committed, pushed or deployed. No secrets.
# On pull requests that touch the identity code, and on demand.

name: Private identity (zk)

on:
  workflow_dispatch:
  pull_request:
    paths: ['zetaphy-network/zkid/**', 'zetaphy-network/contracts/ZkIdentity*.sol', 'zetaphy-network/contracts/PoseidonT3.sol',
      'zetaphy-network/contracts/PrivateAirdrop.sol', 'zetaphy-network/contracts/PrivatePoll.sol', 'zetaphy-network/test/zkid.test.js',
      'zetaphy-network/test/fixtures/zkid.json', 'zetaphy-hub/zkid*', 'zetaphy-hub/zkid/**', '.github/workflows/zkid.yml']

permissions: {}

concurrency:
  group: zkid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Poseidon copies, circuit, contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
      - name: Install circom2 (WASM) + snarkjs + circomlib, pinned
        working-directory: zetaphy-network/zkid
        run: npm ci --no-audit --no-fund
      - name: Generated Poseidon copies are up to date
        working-directory: zetaphy-network/zkid
        run: node gen-poseidon.js --check
      - name: Circuit compiles to the shipped constraint count
        working-directory: zetaphy-network/zkid
        run: |
          node -e '
            import("./lib.js").then(({ buildCircuit }) => {
              const m = require("../../zetaphy-hub/zkid/manifest.json");
              const { constraints } = buildCircuit();
              if (constraints !== m.constraints) { console.error(`constraints ${constraints} != manifest ${m.constraints}: rerun setup.js`); process.exit(1); }
              console.log(`constraints: ${constraints}`);
            });'
      - name: Circuit tests (valid proofs; wrong root, nullifier, scope, signal, level refused)
        working-directory: zetaphy-network/zkid
        run: npm test
      - name: Contract test (registry, verifier, airdrop, poll)
        working-directory: zetaphy-network
        run: |
          npm ci --no-audit --no-fund
          node --test test/zkid.test.js
