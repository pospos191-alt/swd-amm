# Immune feed: every 30 minutes, read (only) ZETAPHY's ImmuneRegistry over the public RPC and publish the open
# threat feed (docs/future/immune-network.md) as static files on the `immune-feed` branch of this repository:
#   feed.json, feed.ndjson, rss.xml, atom.xml and snapshot.pq.json (ML-DSA-44 signed, when the secret is set)
# Served for free by raw.githubusercontent.com and jsDelivr (https://cdn.jsdelivr.net/gh/<owner>/<repo>@immune-feed/);
# no server, no paid service. The feed is a convenience copy: ImmuneRegistry and every ImmuneMirror stay the source
# of truth, and the SDK (zetaphy-network/src/immune/sdk.js) checks the snapshot signature against a pinned key.
#
# Secret (optional): IMMUNE_FEED_PQ_SEED = 0x… 32 bytes, a TESTNET ML-DSA-44 seed used only to sign the feed
# (generate with `node -e "console.log('0x'+require('crypto').randomBytes(32).toString('hex'))"`); publish its
# keyHash in zetaphy-chain/hyperlane/immune-network.json (feed.keyHash). Without it the feed is built unsigned
# and says so. Until ImmuneRegistry is deployed (registry null) the feed is empty with status "not-deployed".
# Scheduled workflows run on the default branch only.

name: immune-feed

on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: immune-feed
  cancel-in-progress: false

jobs:
  feed:
    name: Build and publish the immune feed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            zetaphy-network
            zetaphy-neuro
            zetaphy-hub/pqattest.js
            zetaphy-chain/hyperlane

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: zetaphy-network/package-lock.json

      - name: Install (runtime dependencies only)
        run: npm ci --omit=dev --no-audit --no-fund --prefix zetaphy-network

      - name: Build the feed
        env:
          IMMUNE_FEED_PQ_SEED: ${{ secrets.IMMUNE_FEED_PQ_SEED }}
        run: node zetaphy-network/scripts/immune-feed.js --out "$RUNNER_TEMP/feed"

      - name: Publish to the immune-feed branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd "$RUNNER_TEMP/feed"
          git init -q -b immune-feed
          git config user.name "immune-feed[bot]"
          git config user.email "immune-feed@users.noreply.github.com"
          printf '# ZETAPHY immune feed\n\nGenerated by .github/workflows/immune-feed.yml from ImmuneRegistry. Format: docs/future/immune-network.md.\n' > README.md
          git add -A
          git commit -q -m "immune feed $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" immune-feed
