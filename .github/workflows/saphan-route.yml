# ZETAPHY Saphan, EVM routes v2: one source chain <-> ZETAPHY, both ways, testnets only.
# The chain comes from zetaphy-chain/hyperlane/saphan-chains.json (adding a chain = an entry there + this workflow).
#   source chain: SimpleMultisig (guardian, proposer) + ZetaphyTimelock (governance), our multisig ISM for origin
#                 ZETAPHY (the chain's Hyperlane factory), HyperlaneLockBoxV2 (locks; releases after a delay)
#   ZETAPHY:      the ISM for this origin (ZETAPHY's factory, Hyperlane's validators), then
#                 zetaphy deploy-bridge --hyperlane-outbox: its own BridgeGuard + bridged token, BridgeAirlock,
#                 NeuroLane, HyperlaneLane, HyperlaneOutbox; deployed CLOSED (admin = the timelock, guardian = the multisig)
# The lockbox's address is fixed in advance (the deployer's nonce on the source chain), so the source chain's roles
# go first, then ZETAPHY, then the lockbox exactly there (docs/SAPHAN-MULTICHAIN.md).
#
# mode = check    read only: the source chain (Mailbox, hook, ISM factory, fee, our ISM's address), the deployer,
#                 and the address of ZETAPHY_VALIDATOR_KEY (to put in the chain table)
# mode = dry_run  the whole deploy and a round trip on local chains: an anvil fork of the source chain (its real
#                 Mailbox and ISM factory) and a fresh local ZETAPHY (77390) with Hyperlane core from the pinned CLI;
#                 throwaway validator keys sign the checkpoints. Needs neither secrets nor the ZETAPHY RPC.
# mode = deploy   the real deploy (manual run only; key = ZETAPHY_DEPLOYER_KEY, the same deployer on both chains);
#                 pushes the addresses (saphan-routes.json) to the branch saphan/<chain>
# On pull requests: check + dry_run for every chain of the table. Cost: free (GitHub-hosted runner, public repository).
#
# token = <key>   a TOKEN route instead (tokens born on ZETAPHY, docs/SAPHAN-TOKENS.md): the token `tokens.<key>` of the
#                 chain table, to this chain and back (contracts/SaphanTokens.sol):
#   destination:  the chain's v2 SimpleMultisig + ZetaphyTimelock when that route is deployed (else new ones), our
#                 multisig ISM for origin ZETAPHY, then SaphanSyntheticToken (mints after a delay; sendBack burns)
#   ZETAPHY:      the ISM of Hyperlane's validators for this chain, ZetaphyTokenVault (escrow; releases after a delay)
#   Both deployed CLOSED (paused; governance = the timelocks, guardian = the multisigs). The synthetic's address is
#   fixed in advance (the deployer's nonce on the chain): roles there, then the vault on ZETAPHY, then the synthetic.
#   check: the chain as above + the token on ZETAPHY; dry_run: the same local chains, a stand-in for the token (or
#   token = test: a BZTPHY-like one); deploy: pushes saphan-routes.json `tokens` to the branch saphan/<token>-<chain>.
#   On pull requests the dry run does both: the ETH route, then token = test.

name: saphan-route

on:
  pull_request:
    paths:
      - '.github/workflows/saphan-route.yml'
      - 'zetaphy-chain/hyperlane/saphan-chains.json'
      - 'zetaphy-network/scripts/saphan.js'
      - 'zetaphy-network/scripts/saphan-dryrun.js'
      - 'zetaphy-network/src/saphan.js'
      - 'zetaphy-network/contracts/HyperlaneLockBoxV2.sol'
      - 'zetaphy-network/contracts/BridgeGuard.sol'
      - 'zetaphy-network/contracts/SaphanTokens.sol'
  workflow_dispatch:
    inputs:
      chain:
        description: "the source chain (a name in zetaphy-chain/hyperlane/saphan-chains.json)"
        required: true
        default: 'basesepolia'
        type: choice
        options: ['sepolia', 'basesepolia', 'arbitrumsepolia']
      mode:
        description: "check = read only; dry_run = on local chains; deploy = the real testnets"
        required: true
        default: 'check'
        type: choice
        options: ['check', 'dry_run', 'deploy']
      token:
        description: "empty = the ETH route of this chain; a key of `tokens` in saphan-chains.json (e.g. zetaphy) = that token's route to this chain; test = a BZTPHY-like stand-in (dry_run only)"
        required: false
        default: ''
        type: string

# Least privilege: read-only by default. Keys only in environments (docs/SECRETS-HARDENING.md):
#   deploy            -> testnet-deploy     (ZETAPHY_DEPLOYER_KEY; required reviewer, main only)
#   validator address -> testnet-automation (ZETAPHY_VALIDATOR_KEY, the relayer's validator; main only)
# Pull requests, check and dry_run use no secret and no environment.
permissions:
  contents: read

jobs:
  route:
    name: Saphan route ${{ matrix.chain }} <-> ZETAPHY (testnet)${{ inputs.token != '' && format(' token {0}', inputs.token) || '' }}
    if: github.event_name == 'pull_request' || inputs.mode != 'deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        chain: ${{ github.event_name == 'pull_request' && fromJSON('["sepolia","basesepolia","arbitrumsepolia"]') || fromJSON(format('["{0}"]', inputs.chain)) }}
    defaults:
      run:
        shell: bash
        working-directory: zetaphy-network
    env:
      MODE: ${{ github.event_name == 'pull_request' && 'dry_run' || inputs.mode }}
      CHAIN: ${{ matrix.chain }}
      TOKEN: ${{ github.event_name == 'pull_request' && 'test' || inputs.token }}
      HYP_CLI: "@hyperlane-xyz/cli@45.0.1"
      DEPLOYER: "0x6af57fC3633dD0F7907f7900dbd4A2822F43a245"
      # anvil's well-known dev key #0 (public, dry run only)
      DEV_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund

      - name: The chain table entry
        id: t
        run: |
          node -e '
            import("./src/saphan.js").then(({ loadChains, chainOf }) => {
              const t = loadChains(), c = chainOf(t, process.env.CHAIN);
              console.log(`rpc=${c.rpc.join(",")}`); console.log(`chainId=${c.chainId}`); console.log(`faucetEth=${c.faucetEth ?? "0.05"}`);
              console.log(`validators=${t.zetaphyValidators.validators.length}`); console.log(`zrpc=${t.zetaphy.rpc[0]}`);
            })' | tee -a "$GITHUB_OUTPUT"
          # a token route: the key must be a token of the table with this chain as a destination ("test": dry run only)
          if [ -n "$TOKEN" ]; then
            [[ "$TOKEN" =~ ^[a-z0-9]{1,15}$ ]] || { echo "::error::token: a key of a-z 0-9"; exit 1; }
            if [ "$TOKEN" = test ]; then [ "$MODE" = dry_run ] || { echo "::error::token = test is for dry_run only"; exit 1; }
            else node -e 'import("./src/saphan.js").then(({ loadChains, tokenOf }) => { const k = tokenOf(loadChains(), process.argv[1]);
              if (!k.destinations.includes(process.argv[2])) { console.error(`token ${k.key}: ${process.argv[2]} is not one of its destinations (${k.destinations.join(", ") || "none"}${k.why ? `: ${k.why}` : ""})`); process.exit(1); } })' "$TOKEN" "$CHAIN"; fi
          fi

      - name: Check the source chain (read only)
        id: check
        env:
          ORIGIN_RPC: ${{ steps.t.outputs.rpc }}
        run: |
          out=$(node scripts/saphan.js check --chain "$CHAIN" | tail -1); echo "$out" | jq .
          echo "pending=$(jq -r .pendingTxs <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "balance=$(jq -r .balance <<<"$out")" >> "$GITHUB_OUTPUT"

      - name: Check the token on ZETAPHY (read only; token routes)
        if: env.TOKEN != '' && env.TOKEN != 'test' && env.MODE != 'dry_run'
        env:
          ORIGIN_RPC: ${{ steps.t.outputs.rpc }}
          ZETAPHY_RPC: ${{ steps.t.outputs.zrpc }}
        run: node scripts/saphan.js token-check --token "$TOKEN" --chain "$CHAIN" | tail -1 | jq .zetaphy

      - name: Install anvil (pinned)
        if: env.MODE == 'dry_run'
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.2.3

      - name: Dry run on local chains (a fork of the source chain, a fresh ZETAPHY with Hyperlane core)
        if: env.MODE == 'dry_run'
        env:
          ORIGIN_URL: ${{ steps.t.outputs.rpc }}
        run: |
          set -o pipefail
          W=$(mktemp -d)
          anvil --fork-url "${ORIGIN_URL%%,*}" --port 8601 --silent &
          anvil --chain-id 77390 --port 8602 --silent &
          for port in 8601 8602; do for _ in $(seq 1 60); do curl -fs -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' 127.0.0.1:$port >/dev/null && break; sleep 2; done; done
          npm i -g --no-audit --no-fund "$HYP_CLI"
          mkdir -p "$W/reg/chains/zetaphy"
          sed 's#https://rpc.sawasdeecoin.com#http://127.0.0.1:8602#' ../zetaphy-chain/hyperlane/registry/chains/zetaphy/metadata.yaml > "$W/reg/chains/zetaphy/metadata.yaml"
          DEV=$(node -e 'console.log(new (require("ethers").Wallet)(process.argv[1]).address)' "$DEV_KEY")
          # a local stand-in for ZETAPHY's core: the same contracts (Mailbox, merkle tree hook, ISM factories), a test default ISM
          printf 'owner: "%s"\ndefaultIsm:\n  type: testIsm\ndefaultHook:\n  type: merkleTreeHook\nrequiredHook:\n  type: protocolFee\n  owner: "%s"\n  beneficiary: "%s"\n  protocolFee: "0"\n  maxProtocolFee: "1000000000"\n' "$DEV" "$DEV" "$DEV" > "$W/core.yaml"
          HYP_KEY="$DEV_KEY" hyperlane core deploy --chain zetaphy --config "$W/core.yaml" -r "$W/reg" --yes > "$W/core.log" 2>&1 || { tail -40 "$W/core.log"; exit 1; }
          export ORIGIN_RPC=http://127.0.0.1:8601 ZETAPHY_RPC=http://127.0.0.1:8602 ZETAPHY_CORE="$W/reg/chains/zetaphy/addresses.yaml"
          if [ -z "$TOKEN" ] || [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            node scripts/saphan-dryrun.js --chain "$CHAIN" | tee "$W/dry.log"
            grep -q '^DRY RUN OK' "$W/dry.log"
          fi
          # a token route (on pull requests: token = test, a BZTPHY-like stand-in), on the same two chains
          if [ -n "$TOKEN" ]; then
            node scripts/saphan-dryrun.js --chain "$CHAIN" --token "$TOKEN" | tee "$W/token.log"
            grep -q '^TOKEN DRY RUN OK' "$W/token.log"
          fi

  validator-address:
    name: Our validator's address (ZETAPHY_VALIDATOR_KEY; the address only)
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'dry_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: testnet-automation
    defaults:
      run:
        shell: bash
        working-directory: zetaphy-network
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund

      - name: Our validator's address (from ZETAPHY_VALIDATOR_KEY; the address only)
        env:
          VKEY: ${{ secrets.ZETAPHY_VALIDATOR_KEY }}
        run: |
          if [ -z "$VKEY" ]; then echo "::warning::the secret ZETAPHY_VALIDATOR_KEY is not set in the environment testnet-automation (docs/SECRETS-HARDENING.md, docs/SAPHAN-MULTICHAIN.md: make one, add it, put its address in saphan-chains.json zetaphyValidators)"; exit 0; fi
          k=$(printf '%s' "$VKEY" | tr -d '[:space:]'); k=${k#0x}; echo "::add-mask::$k"; echo "::add-mask::0x$k"
          a=$(K="0x$k" node -e 'console.log(new (require("ethers").Wallet)(process.env.K).address)'); unset k VKEY
          echo "ZETAPHY_VALIDATOR_KEY address: $a"
          node -e 'import("./src/saphan.js").then(({ loadChains }) => { const v = loadChains().zetaphyValidators.validators.map((x) => x.toLowerCase());
            if (!v.includes(process.argv[1].toLowerCase())) { console.log(`::warning::${process.argv[1]} is not in saphan-chains.json zetaphyValidators.validators yet`); } })' "$a"

  deploy:
    name: Saphan route ${{ matrix.chain }} <-> ZETAPHY (testnet) deploy${{ inputs.token != '' && format(' token {0}', inputs.token) || '' }}
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: testnet-deploy
    permissions:
      contents: write   # pushes the addresses to saphan/<chain>
    strategy:
      fail-fast: false
      matrix:
        chain: ${{ github.event_name == 'pull_request' && fromJSON('["sepolia","basesepolia","arbitrumsepolia"]') || fromJSON(format('["{0}"]', inputs.chain)) }}
    defaults:
      run:
        shell: bash
        working-directory: zetaphy-network
    env:
      MODE: ${{ github.event_name == 'pull_request' && 'dry_run' || inputs.mode }}
      CHAIN: ${{ matrix.chain }}
      TOKEN: ${{ github.event_name == 'pull_request' && 'test' || inputs.token }}
      HYP_CLI: "@hyperlane-xyz/cli@45.0.1"
      DEPLOYER: "0x6af57fC3633dD0F7907f7900dbd4A2822F43a245"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund

      - name: The chain table entry
        id: t
        run: |
          node -e '
            import("./src/saphan.js").then(({ loadChains, chainOf }) => {
              const t = loadChains(), c = chainOf(t, process.env.CHAIN);
              console.log(`rpc=${c.rpc.join(",")}`); console.log(`chainId=${c.chainId}`); console.log(`faucetEth=${c.faucetEth ?? "0.05"}`);
              console.log(`validators=${t.zetaphyValidators.validators.length}`); console.log(`zrpc=${t.zetaphy.rpc[0]}`);
            })' | tee -a "$GITHUB_OUTPUT"
          # a token route: the key must be a token of the table with this chain as a destination ("test": dry run only)
          if [ -n "$TOKEN" ]; then
            [[ "$TOKEN" =~ ^[a-z0-9]{1,15}$ ]] || { echo "::error::token: a key of a-z 0-9"; exit 1; }
            if [ "$TOKEN" = test ]; then [ "$MODE" = dry_run ] || { echo "::error::token = test is for dry_run only"; exit 1; }
            else node -e 'import("./src/saphan.js").then(({ loadChains, tokenOf }) => { const k = tokenOf(loadChains(), process.argv[1]);
              if (!k.destinations.includes(process.argv[2])) { console.error(`token ${k.key}: ${process.argv[2]} is not one of its destinations (${k.destinations.join(", ") || "none"}${k.why ? `: ${k.why}` : ""})`); process.exit(1); } })' "$TOKEN" "$CHAIN"; fi
          fi

      - name: Check the source chain (read only)
        id: check
        env:
          ORIGIN_RPC: ${{ steps.t.outputs.rpc }}
        run: |
          out=$(node scripts/saphan.js check --chain "$CHAIN" | tail -1); echo "$out" | jq .
          echo "pending=$(jq -r .pendingTxs <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "balance=$(jq -r .balance <<<"$out")" >> "$GITHUB_OUTPUT"

      - name: Check the token on ZETAPHY (read only; token routes)
        if: env.TOKEN != '' && env.TOKEN != 'test' && env.MODE != 'dry_run'
        env:
          ORIGIN_RPC: ${{ steps.t.outputs.rpc }}
          ZETAPHY_RPC: ${{ steps.t.outputs.zrpc }}
        run: node scripts/saphan.js token-check --token "$TOKEN" --chain "$CHAIN" | tail -1 | jq .zetaphy

      - name: Deploy on the testnets
        if: env.MODE == 'deploy' && github.event_name == 'workflow_dispatch' && env.TOKEN == ''
        env:
          KEY: ${{ secrets.ZETAPHY_DEPLOYER_KEY }}
          ORIGIN_RPC: ${{ steps.t.outputs.rpc }}
          ZETAPHY_RPC: ${{ steps.t.outputs.zrpc }}
          PENDING: ${{ steps.check.outputs.pending }}
          BALANCE: ${{ steps.check.outputs.balance }}
          NEED: ${{ steps.t.outputs.faucetEth }}
          VALIDATORS: ${{ steps.t.outputs.validators }}
        run: |
          set -o pipefail
          [ -n "$KEY" ] || { echo "::error::the secret ZETAPHY_DEPLOYER_KEY is not set in this job's environment (docs/SECRETS-HARDENING.md)"; exit 1; }
          [ "$VALIDATORS" -gt 0 ] || { echo "::error::saphan-chains.json zetaphyValidators.validators is empty: add the address of ZETAPHY_VALIDATOR_KEY first (mode = check prints it)"; exit 1; }
          zc=$(curl -fsS --max-time 30 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' "$ZETAPHY_RPC" | jq -r .result) || zc=""
          [ "$zc" = "0x12e4e" ] || { echo "::error::the ZETAPHY RPC answers '$zc', not 0x12e4e (paused?): nothing deployed"; exit 1; }
          [ "$PENDING" = 0 ] || { echo "::error::the deployer has pending $CHAIN transactions: the lockbox address is not fixed; nothing deployed"; exit 1; }
          awk -v b="$BALANCE" -v n="$NEED" 'BEGIN{exit !(b>=n/2)}' || { echo "::error::the deployer has $BALANCE ETH on $CHAIN ($NEED recommended, at least half needed)"; exit 1; }
          k=$(printf '%s' "$KEY" | tr -d '[:space:]'); k=${k#0x}; echo "::add-mask::$k"; echo "::add-mask::0x$k"
          H="$RUNNER_TEMP/zh"; mkdir -p "$H"; umask 077; printf '0x%s' "$k" > "$H/worker.key"; unset k KEY
          [ "$(node -e 'console.log(new (require("ethers").Wallet)(require("fs").readFileSync(process.argv[1],"utf8").trim()).address)' "$H/worker.key")" = "$DEPLOYER" ] \
            || { rm -f "$H/worker.key"; echo "::error::ZETAPHY_DEPLOYER_KEY is not $DEPLOYER"; exit 1; }
          trap 'rm -f "$H/worker.key"' EXIT
          export KEYFILE="$H/worker.key"
          T=$(node -e 'import("./src/saphan.js").then(({ loadChains, chainOf }) => { const t = loadChains(); console.log(JSON.stringify({ z: t.zetaphy, c: chainOf(t, process.argv[1]) })); })' "$CHAIN")
          z() { jq -r ".z.$1" <<<"$T"; }; c() { jq -r ".c.$1" <<<"$T"; }
          # 1. the source chain's roles and our ISM; the lockbox's address
          OFROM=$(( $(curl -fsS --max-time 30 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' "${ORIGIN_RPC%%,*}" | jq -r .result) ))
          node scripts/saphan.js origin-prepare --chain "$CHAIN" | tail -1 | tee "$H/prep.json"
          LB=$(jq -r .lockboxAt "$H/prep.json")
          # 2. ZETAPHY: the ISM for this origin, then the bridge with the way back (CLOSED)
          node scripts/saphan.js zetaphy-ism --chain "$CHAIN" | tail -1 | tee "$H/zism.json"
          ZFROM=$(( $(curl -fsS --max-time 30 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' "$ZETAPHY_RPC" | jq -r .result) ))
          ZETAPHY_HOME="$H" node cli.js deploy-bridge --testnet --rpc "$ZETAPHY_RPC" --jobs "$(z neuroJobs)" --threats "$(z threats)" \
            --control "$(z neuroControl)" --lockbox "$(c chainId):$LB" --hyperlane-mailbox "$(z mailbox)" --hyperlane-origin "$(c domain)" \
            --hyperlane-ism "$(jq -r .ism "$H/zism.json")" --hyperlane-outbox --governance "$(z timelock)" --guardian "$(z guardian)" \
            --decimals 18 --daily-limit "$(c limits.zetaphyDailyLimit)" --quarantine "$(c limits.quarantine)" \
            --token-name "$(c token.name)" --token-symbol "$(c token.symbol)" | tee "$H/zetaphy.log"
          pick() { grep -Eo "$1 0x[0-9a-fA-F]{40}" "$H/zetaphy.log" | tail -1 | awk '{print $2}'; }
          # 3. the lockbox, exactly at $LB
          node scripts/saphan.js origin-lockbox --chain "$CHAIN" --lane "$(pick HyperlaneLane)" --outbox "$(pick HyperlaneOutbox)" --expect "$LB" \
            --multisig "$(jq -r .multisig "$H/prep.json")" --timelock "$(jq -r .timelock "$H/prep.json")" --ism "$(jq -r .ism "$H/prep.json")" | tail -1 | tee "$H/lockbox.json"
          jq --arg chain "$CHAIN" --arg guard "$(pick BridgeGuard)" --arg token "$(pick BridgedToken)" --arg airlock "$(pick BridgeAirlock)" \
            --arg neuroLane "$(pick NeuroLane)" --arg lane "$(pick HyperlaneLane)" --arg outbox "$(pick HyperlaneOutbox)" --arg zism "$(jq -r .ism "$H/zism.json")" \
            --argjson zfrom "$ZFROM" --argjson ofrom "$OFROM" --slurpfile prep "$H/prep.json" --slurpfile lb "$H/lockbox.json" --arg run "${{ github.run_id }}" \
            '.routes[$chain] = {version: 2, state: "CLOSED",
              zetaphy: {bridgeGuard: $guard, bridgedToken: $token, bridgeAirlock: $airlock, neuroLane: $neuroLane, hyperlaneLane: $lane, hyperlaneOutbox: $outbox, ism: $zism, fromBlock: $zfrom},
              origin: {lockbox: $lb[0].lockbox, ism: $prep[0].ism, multisig: $prep[0].multisig, timelock: $prep[0].timelock, deployTx: $lb[0].tx, fromBlock: $ofrom},
              workflowRun: $run}' ../zetaphy-chain/hyperlane/saphan-routes.json > "$H/routes.json"
          mv "$H/routes.json" ../zetaphy-chain/hyperlane/saphan-routes.json
          jq ".routes[\"$CHAIN\"]" ../zetaphy-chain/hyperlane/saphan-routes.json

      - name: Deploy a token route on the testnets (closed)
        if: env.MODE == 'deploy' && github.event_name == 'workflow_dispatch' && env.TOKEN != ''
        env:
          KEY: ${{ secrets.ZETAPHY_DEPLOYER_KEY }}
          ORIGIN_RPC: ${{ steps.t.outputs.rpc }}
          ZETAPHY_RPC: ${{ steps.t.outputs.zrpc }}
          PENDING: ${{ steps.check.outputs.pending }}
          BALANCE: ${{ steps.check.outputs.balance }}
          NEED: ${{ steps.t.outputs.faucetEth }}
          VALIDATORS: ${{ steps.t.outputs.validators }}
        run: |
          set -o pipefail
          [ -n "$KEY" ] || { echo "::error::the secret ZETAPHY_DEPLOYER_KEY is not set in this job's environment (docs/SECRETS-HARDENING.md)"; exit 1; }
          [ "$VALIDATORS" -gt 0 ] || { echo "::error::saphan-chains.json zetaphyValidators.validators is empty: add the address of ZETAPHY_VALIDATOR_KEY first (mode = check prints it)"; exit 1; }
          zc=$(curl -fsS --max-time 30 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' "$ZETAPHY_RPC" | jq -r .result) || zc=""
          [ "$zc" = "0x12e4e" ] || { echo "::error::the ZETAPHY RPC answers '$zc', not 0x12e4e (paused?): nothing deployed"; exit 1; }
          [ "$PENDING" = 0 ] || { echo "::error::the deployer has pending $CHAIN transactions: the synthetic's address is not fixed; nothing deployed"; exit 1; }
          awk -v b="$BALANCE" -v n="$NEED" 'BEGIN{exit !(b>=n/4)}' || { echo "::error::the deployer has $BALANCE ETH on $CHAIN (at least $NEED/4 needed)"; exit 1; }
          [ "$(jq -r --arg k "$TOKEN" --arg c "$CHAIN" '.tokens[$k][$c].destination.synthetic // empty' ../zetaphy-chain/hyperlane/saphan-routes.json)" = "" ] \
            || { echo "::error::saphan-routes.json already has the $TOKEN route to $CHAIN"; exit 1; }
          k=$(printf '%s' "$KEY" | tr -d '[:space:]'); k=${k#0x}; echo "::add-mask::$k"; echo "::add-mask::0x$k"
          H="$RUNNER_TEMP/zh"; mkdir -p "$H"; umask 077; printf '0x%s' "$k" > "$H/worker.key"; unset k KEY
          [ "$(node -e 'console.log(new (require("ethers").Wallet)(require("fs").readFileSync(process.argv[1],"utf8").trim()).address)' "$H/worker.key")" = "$DEPLOYER" ] \
            || { rm -f "$H/worker.key"; echo "::error::ZETAPHY_DEPLOYER_KEY is not $DEPLOYER"; exit 1; }
          trap 'rm -f "$H/worker.key"' EXIT
          export KEYFILE="$H/worker.key"
          bn() { echo $(( $(curl -fsS --max-time 30 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' "$1" | jq -r .result) )); }
          OFROM=$(bn "${ORIGIN_RPC%%,*}"); ZFROM=$(bn "$ZETAPHY_RPC")
          # 1. the destination's roles (the v2 route's when deployed) and our ISM; where the synthetic will be
          node scripts/saphan.js token-prepare --token "$TOKEN" --chain "$CHAIN" | tail -1 | tee "$H/prep.json"
          SYN=$(jq -r .syntheticAt "$H/prep.json")
          # 2. ZETAPHY: the vault (governance: the ZETAPHY timelock; guardian: the guardian multisig; vaccine: the ThreatRegistry)
          node scripts/saphan.js token-vault --token "$TOKEN" --chain "$CHAIN" --expect "$SYN" | tail -1 | tee "$H/vault.json"
          # 3. the synthetic, exactly at $SYN (governance: the chain's timelock; guardian: its multisig)
          node scripts/saphan.js token-synthetic --token "$TOKEN" --chain "$CHAIN" --vault "$(jq -r .vault "$H/vault.json")" --expect "$SYN" \
            --multisig "$(jq -r .multisig "$H/prep.json")" --timelock "$(jq -r .timelock "$H/prep.json")" --ism "$(jq -r .ism "$H/prep.json")" | tail -1 | tee "$H/syn.json"
          jq --arg key "$TOKEN" --arg chain "$CHAIN" --slurpfile prep "$H/prep.json" --slurpfile v "$H/vault.json" --slurpfile s "$H/syn.json" \
            --argjson zfrom "$ZFROM" --argjson ofrom "$OFROM" --arg run "${{ github.run_id }}" \
            '.tokens[$key][$chain] = {version: 1, state: "CLOSED",
              zetaphy: {vault: $v[0].vault, ism: $v[0].ism, governance: $v[0].governance, guardian: $v[0].guardian, deployTx: $v[0].tx, fromBlock: $zfrom},
              destination: {synthetic: $s[0].synthetic, symbol: $s[0].symbol, ism: $prep[0].ism, multisig: $prep[0].multisig, timelock: $prep[0].timelock, deployTx: $s[0].tx, fromBlock: $ofrom},
              workflowRun: $run}' ../zetaphy-chain/hyperlane/saphan-routes.json > "$H/routes.json"
          mv "$H/routes.json" ../zetaphy-chain/hyperlane/saphan-routes.json
          jq ".tokens[\"$TOKEN\"][\"$CHAIN\"]" ../zetaphy-chain/hyperlane/saphan-routes.json

      - name: Push the addresses to saphan/<chain> (saphan/<token>-<chain> for a token route)
        if: env.MODE == 'deploy' && github.event_name == 'workflow_dispatch'
        run: |
          cd ..
          B="saphan/${TOKEN:+$TOKEN-}$CHAIN"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B "$B"
          git add zetaphy-chain/hyperlane/saphan-routes.json
          git commit -q -m "Saphan route ${TOKEN:+$TOKEN }$CHAIN <-> ZETAPHY on the testnets: addresses" -m "From ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          git push -q --force origin "$B"
          echo "open the pull request: ${{ github.server_url }}/${{ github.repository }}/compare/main...$B"
