# CI/CD for swd-amm (rewritten 2026-09-25; first version 2026-09-24).
#
# What runs, and when:
#   zetaphy-neuro every push / PR — Neuro ZETAPHY tier 1 unit + browser tests. ~2 min.
#   zetaphy-verify every push / PR — tests for the explorer auto-verifier
#                 (its own scheduled run is zetaphy-verify.yml). ~1 min.
#   zetaphy-network every push / PR — NeuroJobs contract + node runner tests,
#                 and native PQ account txs (test/pqtx.test.js, decoded with
#                 the official Cosmos SDK protobuf types).
#                 The real-chain test (npm run test:devnet) needs zetaphyd and
#                 is run by hand. ~1 min.
#   zetaphy-wallet every push / PR — the PQ web wallet: committed bundle
#                 matches its sources + a headless-browser test (it also
#                 checks zetaphy-chain/wallets/ agrees with the page). ~2 min.
#   zetaphy-snap  every push / PR — the MetaMask Snap: builds, the committed
#                 snap.manifest.json shasum matches the build, and the built
#                 snap runs in snaps-jest's simulated MetaMask. ~2 min.
#   zetaphy-chain every push / PR that touches the node setup — applies
#                 setup-node.sh's patches to the pinned Cosmos EVM source
#                 the same way the server does, runs their Go tests (ML-DSA,
#                 IBC transfers + rate limits), builds zetaphyd and runs the
#                 native/contract PQ tests on a real devnet; also checks
#                 cloud-init.sh is setup-node.sh packed. ~15-25 min.
#
# Free-tier budget: GitHub Free gives private repos 2,000 Actions minutes a
# month. The `changes` job runs each test job ONLY when its own files changed
# (a Neuro-only PR costs ~3 min instead of ~17). A manual run tests
# everything; the weekly scheduled run only re-checks cargo audit, because
# new advisories appear without any code change.
#   test-ui       every push / PR — syntax check + a headless-browser smoke
#                 test of test-ui/index.html (catches a page that freezes on
#                 load, like build 2026-09-25o). ~2 min.
#   program       every push / PR — cargo test (unit/property tests), the
#                 attack suite (security/attack-tests, natively and against
#                 the built SBF program) and the full `anchor test` localnet
#                 suite (the same `yarn test` you run in WSL). First run ~20-30 min (compiling), later runs
#                 are faster thanks to the caches.
#   audit         every push / PR — cargo audit against the RustSec database.
#   deploy-devnet ONLY when started by hand (Actions → CI → Run workflow →
#                 tick "deploy to Devnet") AND both jobs above passed. Needs
#                 the two repository secrets described on that job. Never
#                 touches mainnet — there is no mainnet deploy in this file
#                 on purpose (see SECURITY.md: no mainnet before an audit).
#
# This does NOT replace SECURITY.md's "Mandatory steps before ANY mainnet
# use" (devnet testing, an independent read-through, a paid audit) — it only
# guarantees the tests that already exist keep passing.
#
# Known flakiness: Anchor.toml's [test.validator] clones the real Squads v4
# program from a PUBLIC mainnet-beta RPC, which can rate-limit CI. The
# anchor-test step retries 3 times; if it still fails, add a private RPC URL
# as the repository secret MAINNET_RPC_URL (Helius/Triton/QuickNode...) and
# this workflow will use it for the clone instead of the public endpoint.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '23 4 * * 1' # Mondays: cargo audit only
  workflow_dispatch:
    inputs:
      deploy_devnet:
        description: "After tests pass, deploy the program to Devnet (needs DEVNET_DEPLOYER_KEYPAIR + PROGRAM_KEYPAIR secrets)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep these equal to what builds on your own machine (Anchor.toml
  # [toolchain] + `rustc --version` in WSL). If a CI-only compile error ever
  # appears, pinning RUST_TOOLCHAIN to your local version is the first fix.
  SOLANA_VERSION: "3.1.10"
  ANCHOR_VERSION: "0.31.1"
  RUST_TOOLCHAIN: "stable"
  NODE_VERSION: "20"
# Runner image is pinned (not ubuntu-latest): GitHub moves ubuntu-latest to
# Ubuntu 26 on 2026-10-19, and the Solana/Anchor toolchain here is only
# proven on 24.04. Bump deliberately, in its own commit, when ready.

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      program: ${{ steps.f.outputs.program }}
      audit: ${{ steps.f.outputs.audit }}
      ui: ${{ steps.f.outputs.ui }}
      neuro: ${{ steps.f.outputs.neuro }}
      verify: ${{ steps.f.outputs.verify }}
      network: ${{ steps.f.outputs.network }}
      wallet: ${{ steps.f.outputs.wallet }}
      snap: ${{ steps.f.outputs.snap }}
      chain: ${{ steps.f.outputs.chain }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pick the jobs this change needs
        id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          range=""
          if [ "$EVENT" = pull_request ]; then
            range="$BASE...HEAD"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          fi
          # Manual run, first push of a branch, or unknown history: test everything.
          if [ -n "$range" ]; then files=$(git diff --name-only "$range"); else files="ALL"; fi
          echo "$files"
          wf='^\.github/workflows/security\.yml$'
          out() {
            if [ "$EVENT" = schedule ]; then v=false; [ "$1" = audit ] && v=true
            elif [ "$files" = ALL ] || echo "$files" | grep -qE "$2|$wf"; then v=true
            else v=false; fi
            echo "$1=$v" >> "$GITHUB_OUTPUT"
            echo "$1=$v"
          }
          out program '^(programs/|tests/|security/|scripts/|Anchor\.toml$|Cargo\.(toml|lock)$|package\.json$|yarn\.lock$|tsconfig\.json$)'
          out audit '^(programs/|security/|Cargo\.(toml|lock)$)'
          out ui '^test-ui/'
          out neuro '^zetaphy-neuro/'
          out verify '^(zetaphy-verify/|zetaphy-neuro/src/)'
          out network '^(zetaphy-network/|zetaphy-neuro/src/)'
          out wallet '^(zetaphy-wallet/|zetaphy-network/src/pqtx\.js$|zetaphy-chain/wallets/)'
          out snap '^(zetaphy-snap/|zetaphy-network/src/pqtx\.js$)'
          out chain '^(zetaphy-chain/|zetaphy-network/(src/pqtx\.js|src/pq\.js|cli\.js|scripts/devnet\.sh|test/devnet\.(pq|pqcert|cosmoswallet)\.integration\.js)$)'

  test-ui:
    name: test-ui (syntax + page smoke test)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Syntax check (node --check on every inline script)
        run: node test-ui/tests/check-syntax.mjs

      - name: Install Playwright + Chromium
        working-directory: test-ui/tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Page smoke test (page must finish starting up with no errors)
        working-directory: test-ui/tests
        run: node smoke.mjs

      - name: Faucet attack tests (rate limits, spoofed IPs, secret leaks)
        run: node test-ui/tests/faucet-attacks.mjs

  zetaphy-neuro:
    name: zetaphy-neuro (unit + browser tests)
    needs: changes
    if: needs.changes.outputs.neuro == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: zetaphy-neuro
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Unit tests (real compiled contracts on an in-memory EVM)
        run: npm test

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Browser test (web page, RPC answered locally)
        run: npm run test:web

  zetaphy-verify:
    name: zetaphy-verify (unit tests)
    needs: changes
    if: needs.changes.outputs.verify == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: zetaphy-verify
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Unit tests (solc-compiled launcher, simulated chain and explorers)
        run: npm test

  zetaphy-network:
    name: zetaphy-network (contract + runner tests)
    needs: changes
    if: needs.changes.outputs.network == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: zetaphy-network
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Committed contract artifacts match the sources
        run: |
          npm run build
          git diff --exit-code -- artifacts/

      - name: Unit tests (NeuroJobs on an in-memory EVM, runner loop, native PQ txs)
        run: npm test

  zetaphy-wallet:
    name: zetaphy-wallet (bundle + browser test)
    needs: changes
    if: needs.changes.outputs.wallet == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: zetaphy-wallet
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: npm ci --no-audit --no-fund

      # Vercel serves vendor/pqwallet.js as committed, so it must be the
      # build of zetaphy-network/src/pqtx.js and the locked @noble versions.
      - name: Committed bundle matches the sources
        run: |
          npm run build
          git diff --exit-code -- vendor/

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Browser test (create key, encrypt/unlock, send to a mocked RPC)
        run: npm test

  zetaphy-snap:
    name: zetaphy-snap (MetaMask Snap build + simulated tests)
    needs: changes
    if: needs.changes.outputs.snap == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: zetaphy-snap
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: npm ci --no-audit --no-fund

      # MetaMask installs the snap only if dist/bundle.js (+ manifest + icon) hashes
      # to source.shasum in snap.manifest.json. mm-snap build rewrites the manifest
      # when they differ, so a changed manifest here means the committed one is out
      # of date: run `npm run build` in zetaphy-snap/ and commit snap.manifest.json.
      - name: Build; the committed manifest shasum matches the build
        run: |
          npm run build
          git diff --exit-code -- snap.manifest.json

      - name: Manifest is valid (mm-snap manifest)
        run: npx mm-snap manifest

      - name: Tests (the built snap in snaps-jest's simulated MetaMask)
        run: npm test

  zetaphy-chain:
    name: zetaphy-chain (patched node + PQ devnet)
    needs: changes
    if: needs.changes.outputs.chain == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SRC: ${{ github.workspace }}/../cosmos-evm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: cloud-init.sh pins this setup-node.sh (SHA-256)
        run: zetaphy-chain/pack-cloud-init.sh --check

      # cloud-init.sh downloads setup-node.sh from the public repo; warn while
      # this version is not published there yet.
      - name: setup-node.sh is published for cloud-init
        run: |
          url=$(grep -o 'https://raw.githubusercontent.com/[^"]*' zetaphy-chain/cloud-init.sh)
          sha=$(sha256sum zetaphy-chain/setup-node.sh | cut -d' ' -f1)
          got=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1 || true)
          [ "$got" = "$sha" ] && echo "published: $url" || echo "::warning::setup-node.sh $sha is not published at $url yet; Oracle installs need it"

      - name: Set up Go (the version setup-node.sh pins)
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
          cache: false

      - name: Pinned Cosmos EVM source + the ZETAPHY patches (as on the server)
        run: |
          tag=$(sed -n 's/^COSMOS_EVM_TAG="\(.*\)"/\1/p' zetaphy-chain/setup-node.sh)
          commit=$(sed -n 's/^COSMOS_EVM_COMMIT="\(.*\)"/\1/p' zetaphy-chain/setup-node.sh)
          git clone -q --depth 1 --branch "$tag" https://github.com/cosmos/evm.git "$SRC"
          [ "$(git -C "$SRC" rev-parse HEAD)" = "$commit" ]
          bash zetaphy-chain/setup-node.sh --patch-source "$SRC"
          cp -r zetaphy-chain/fork-tests/. "$SRC/"

      - name: Go tests (ML-DSA precompile, ML-DSA-44 account keys, MsgEVMCall) + fuzzing
        working-directory: ${{ env.SRC }}
        run: |
          go test ./precompiles/mldsa/ ./crypto/mldsa44/
          go test ./crypto/mldsa44/ -run '^$' -fuzz FuzzUnmarshalVerify -fuzztime 30s
          cd evmd
          go test -tags=test -run 'EVMCall|PQ' .
          go test -run '^$' -fuzz FuzzEVMCallUnmarshal -fuzztime 20s .

      # Static security checks on the code ZETAPHY added. G115 (int
      # conversions) is excluded only for the upstream rate-limit module,
      # where it flags generated and range-checked code.
      - name: gosec (ZETAPHY code)
        working-directory: ${{ env.SRC }}
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.8
          gosec -quiet -exclude-generated ./crypto/mldsa44/... ./precompiles/mldsa/... ./evmd
          gosec -quiet -exclude-generated -exclude=G115 ./x/ratelimit/...

      - name: Build zetaphyd
        working-directory: ${{ env.SRC }}/evmd
        run: go build -o "$RUNNER_TEMP/zetaphyd" ./cmd/evmd

      - name: ML-DSA vote signatures on a two-validator devnet
        run: bash zetaphy-chain/test-vote-keys.sh "$RUNNER_TEMP/zetaphyd" "$RUNNER_TEMP/vote-keys"

      # ibc-go's test app expects "cosmos1" addresses, so these run with the
      # stock prefix (after the build above, which keeps "zetaphy1").
      - name: IBC tests (transfers through the stack, rate limits enforced)
        working-directory: ${{ env.SRC }}/evmd
        run: |
          sed -i 's/Bech32Prefix = "zetaphy"/Bech32Prefix = "cosmos"/' config/bech32.go
          go test -tags=test ./tests/ibc/...

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: PQ wallets, native ML-DSA accounts and block certificates on real devnets
        working-directory: zetaphy-network
        run: |
          npm ci --no-audit --no-fund
          ZETAPHYD="$RUNNER_TEMP/zetaphyd" npm run test:devnet:pq
          ZETAPHYD="$RUNNER_TEMP/zetaphyd" npm run test:devnet:pqcert
          ZETAPHYD="$RUNNER_TEMP/zetaphyd" npm run test:devnet:cosmoswallet

  program:
    name: program (cargo test + anchor test)
    needs: changes
    if: needs.changes.outputs.program == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      # The Solana toolchain, the Rust target dir and the test validator fill
      # the runner's disk (the linker then dies with a bus error). Remove
      # preinstalled SDKs this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            security/attack-tests -> target

      - name: Cache Solana CLI
        id: solana-cache
        uses: actions/cache@v5
        with:
          path: ~/.local/share/solana/install
          key: ${{ runner.os }}-solana-${{ env.SOLANA_VERSION }}

      - name: Install Solana CLI
        run: |
          if [ "${{ steps.solana-cache.outputs.cache-hit }}" != "true" ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Cache Anchor CLI (avm)
        uses: actions/cache@v5
        with:
          path: |
            ~/.avm
            ~/.cargo/bin/avm
            ~/.cargo/bin/anchor
          key: ${{ runner.os }}-avm-anchor-${{ env.ANCHOR_VERSION }}

      - name: Install Anchor CLI
        run: |
          if ! command -v avm >/dev/null 2>&1; then
            cargo install --git https://github.com/solana-foundation/anchor --tag "v${ANCHOR_VERSION}" avm --locked --force
          fi
          if ! anchor --version 2>/dev/null | grep -q "${ANCHOR_VERSION}"; then
            avm install "${ANCHOR_VERSION}"
          fi
          avm use "${ANCHOR_VERSION}"
          anchor --version | grep -q "${ANCHOR_VERSION}" || { echo "::error::anchor ${ANCHOR_VERSION} did not install"; exit 1; }
          solana --version
          anchor --version

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      # Throwaway keys that exist only inside this CI run:
      # - a payer wallet for the local test validator (Anchor.toml points
      #   [provider] wallet at ~/.config/solana/id.json), and
      # - a program keypair. The real one (3zKYY...) is NOT in the repo
      #   (target/ is gitignored), so CI makes its own and rewrites
      #   declare_id! and Anchor.toml to its address — in this run's checkout
      #   only. Tests read the id from the workspace, so they don't care.
      - name: Create CI-only wallet + program keypair
        run: |
          mkdir -p ~/.config/solana target/deploy
          solana-keygen new --no-bip39-passphrase --silent --force --outfile ~/.config/solana/id.json
          solana-keygen new --no-bip39-passphrase --silent --force --outfile target/deploy/swd_amm-keypair.json
          pid=$(solana-keygen pubkey target/deploy/swd_amm-keypair.json)
          sed -i -E "s/declare_id!\(\"[1-9A-HJ-NP-Za-km-z]+\"\)/declare_id!(\"${pid}\")/" programs/swd_amm/src/lib.rs
          sed -i -E "s/^swd_amm = \"[1-9A-HJ-NP-Za-km-z]+\"/swd_amm = \"${pid}\"/" Anchor.toml
          grep -q "declare_id!(\"${pid}\")" programs/swd_amm/src/lib.rs || { echo "::error::could not rewrite declare_id!"; exit 1; }
          grep -n "declare_id" programs/swd_amm/src/lib.rs
          grep -n "^swd_amm = " Anchor.toml

      - name: Use private RPC for the Squads clone (if MAINNET_RPC_URL secret is set)
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: |
          if [ -n "$MAINNET_RPC_URL" ]; then
            sed -i "s#^url = \"https://api.mainnet-beta.solana.com\"#url = \"${MAINNET_RPC_URL}\"#" Anchor.toml
            echo "Using the private RPC from MAINNET_RPC_URL for [[test.validator.clone]]"
          else
            echo "MAINNET_RPC_URL not set — using the public mainnet-beta RPC (may rate-limit)"
          fi

      - name: cargo test (unit + proptest property tests, no validator)
        run: cargo test -p swd_amm

      - name: mainnet build flags compile (24h-48h timelock)
        run: cargo check -p swd_amm --features mainnet

      - name: Attack suite, native build (security/attack-tests)
        run: cargo test --locked --manifest-path security/attack-tests/Cargo.toml

      - name: anchor build (SBF program + IDL)
        run: anchor build

      # Same attacks against the real SBF program anchor just built — this
      # also runs the DLMM attacks, which can't run natively (see
      # security/attack-tests/tests/dlmm_attacks.rs).
      - name: Attack suite, real SBF program (incl. DLMM)
        run: BPF_OUT_DIR="$PWD/target/deploy" cargo test --locked --manifest-path security/attack-tests/Cargo.toml -- --include-ignored

      - name: anchor test (full localnet suite, same as `yarn test`)
        run: |
          attempt=1
          max_attempts=3
          until yarn test; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::anchor test failed $max_attempts times. If the log shows a clone/RPC error at validator start, set the MAINNET_RPC_URL secret (see the top of this file)."
              exit 1
            fi
            echo "anchor test failed (attempt $attempt/$max_attempts) — retrying in 20s in case the public RPC rate-limited the Squads clone."
            attempt=$((attempt + 1))
            sleep 20
          done

      - name: Upload validator / program logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: anchor-logs
          path: |
            .anchor/program-logs/
            .anchor/test-ledger/test-ledger-log.txt
            .anchor/test-ledger/validator.log
          if-no-files-found: ignore
          retention-days: 7

  audit:
    name: cargo audit (RustSec advisories)
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Fails the job on any known vulnerability in Cargo.lock. "Unmaintained"
      # / "unsound" notices on transitive Solana/Anchor crates are printed as
      # warnings (they are not ours to fix) and do not fail the job.
      - name: cargo audit
        run: cargo audit

  deploy-devnet:
    name: deploy to Devnet (manual)
    needs: [test-ui, program, audit]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_devnet
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Create an Environment named "devnet" in Settings → Environments and add
    # yourself as a required reviewer if you want a second "Approve" click
    # before anything is deployed.
    environment: devnet
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Cache Solana CLI
        id: solana-cache
        uses: actions/cache@v5
        with:
          path: ~/.local/share/solana/install
          key: ${{ runner.os }}-solana-${{ env.SOLANA_VERSION }}

      - name: Install Solana CLI
        run: |
          if [ "${{ steps.solana-cache.outputs.cache-hit }}" != "true" ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Cache Anchor CLI (avm)
        uses: actions/cache@v5
        with:
          path: |
            ~/.avm
            ~/.cargo/bin/avm
            ~/.cargo/bin/anchor
          key: ${{ runner.os }}-avm-anchor-${{ env.ANCHOR_VERSION }}

      - name: Install Anchor CLI
        run: |
          if ! command -v avm >/dev/null 2>&1; then
            cargo install --git https://github.com/solana-foundation/anchor --tag "v${ANCHOR_VERSION}" avm --locked --force
          fi
          if ! anchor --version 2>/dev/null | grep -q "${ANCHOR_VERSION}"; then
            avm install "${ANCHOR_VERSION}"
          fi
          avm use "${ANCHOR_VERSION}"
          anchor --version | grep -q "${ANCHOR_VERSION}" || { echo "::error::anchor ${ANCHOR_VERSION} did not install"; exit 1; }

      # Two repository secrets, each the full contents of a Solana keypair
      # JSON file (the [12,34,...] array):
      #   DEVNET_DEPLOYER_KEYPAIR  a Devnet-only wallet with a few SOL that is
      #                            (or will become) the program's upgrade
      #                            authority. Do NOT reuse a mainnet wallet.
      #   PROGRAM_KEYPAIR          target/deploy/swd_amm-keypair.json from your
      #                            machine (address 3zKYY...), so the program
      #                            lands at the same id the UI and declare_id! use.
      - name: Write deploy keys (from secrets)
        env:
          DEVNET_DEPLOYER_KEYPAIR: ${{ secrets.DEVNET_DEPLOYER_KEYPAIR }}
          PROGRAM_KEYPAIR: ${{ secrets.PROGRAM_KEYPAIR }}
        run: |
          if [ -z "$DEVNET_DEPLOYER_KEYPAIR" ] || [ -z "$PROGRAM_KEYPAIR" ]; then
            echo "::error::Set both DEVNET_DEPLOYER_KEYPAIR and PROGRAM_KEYPAIR repository secrets before deploying."
            exit 1
          fi
          mkdir -p ~/.config/solana target/deploy
          umask 077
          printf '%s' "$DEVNET_DEPLOYER_KEYPAIR" > ~/.config/solana/devnet-deployer.json
          printf '%s' "$PROGRAM_KEYPAIR" > target/deploy/swd_amm-keypair.json
          want=$(grep -oP 'declare_id!\("\K[1-9A-HJ-NP-Za-km-z]+' programs/swd_amm/src/lib.rs)
          have=$(solana-keygen pubkey target/deploy/swd_amm-keypair.json)
          if [ "$want" != "$have" ]; then
            echo "::error::PROGRAM_KEYPAIR is $have but declare_id! in lib.rs is $want — refusing to deploy."
            exit 1
          fi
          echo "Program id: $have"
          echo "Deployer:   $(solana-keygen pubkey ~/.config/solana/devnet-deployer.json)"
          solana balance "$(solana-keygen pubkey ~/.config/solana/devnet-deployer.json)" --url devnet

      - name: anchor build
        run: anchor build

      - name: Deploy / upgrade on Devnet
        run: |
          anchor deploy --provider.cluster devnet --provider.wallet ~/.config/solana/devnet-deployer.json
          # `solana program show` still loads a default signer, and this runner
          # has no ~/.config/solana/id.json, so point it at the deployer key.
          solana program show "$(solana-keygen pubkey target/deploy/swd_amm-keypair.json)" --url devnet \
            --keypair ~/.config/solana/devnet-deployer.json

      - name: Remove key files
        if: always()
        run: rm -f ~/.config/solana/devnet-deployer.json target/deploy/swd_amm-keypair.json
