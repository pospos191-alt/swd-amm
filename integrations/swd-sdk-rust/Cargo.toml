[package]
name = "swd-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Client for the public SWD (SAWASDEE COIN) APIs: SWD Audit, transaction checks, supply, the Buy SWD Solana Action, and a reader for the on-chain SWD Audit Registry record layout."
license = "MIT"
repository = "https://github.com/pospos191-alt/zetaphy"
homepage = "https://swd-zetaphy.sawasdeecoin.com/developers"
readme = "README.md"
keywords = ["solana", "swd", "audit", "security", "sdk"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]

# Its own workspace: not part of the repo's Anchor workspace (programs/*).
[workspace]

[features]
default = ["blocking", "registry"]
# a blocking client (reqwest::blocking) next to the async one
blocking = ["reqwest/blocking"]
# PDA derivation + byte-layout parser for the on-chain SWD Audit Registry (docs/SWD_AUDIT_REGISTRY.md)
registry = ["dep:sha2", "dep:bs58", "dep:curve25519-dalek"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.22"
sha2 = { version = "0.10", optional = true }
bs58 = { version = "0.5", optional = true }
curve25519-dalek = { version = "4", optional = true, default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
