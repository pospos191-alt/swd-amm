<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Neuro Usage</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main>
  <header>
    <div>
      <h1><img class="logo" src="./logo.svg" alt="" width="34" height="34"> Neuro ZETAPHY</h1>
      <p class="sub" data-i18n="subtitle">Monthly users vs the goal before step 2</p>
      <p class="sub site-links"><a href="https://explorer.sawasdeecoin.com/" target="_blank" rel="noopener noreferrer">ZETAPHY Explorer ↗</a></p>
    </div>
    <button id="lang" type="button" aria-label="Language">ไทย</button>
  </header>

  <section class="stats" id="stats" aria-live="polite">
    <div>
      <div class="row"><span id="monthLabel"></span><span id="pct"></span></div>
      <div class="big" id="users">–</div>
      <div class="row"><span data-i18n="usersLabel">Users this month (approx.)</span><span><span data-i18n="goal">Goal</span> <b id="goal">1,000</b></span></div>
    </div>
    <div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="meter"><span id="bar"></span></div>
    <div class="row"><span data-i18n="checks">Contract checks</span><b id="checks">–</b></div>
    <div class="row"><span data-i18n="last">Users last month</span><b id="prev">–</b></div>
  </section>
  <p id="status" role="status"></p>

  <footer>
    <p data-i18n="privacy">Counted without storing IPs or personal data. Numbers are approximate.</p>
    <p><a href="./" data-i18n="back">Back to contract checker</a></p>
  </footer>
</main>
<script type="module" src="./stats.js"></script>
</body>
</html>
