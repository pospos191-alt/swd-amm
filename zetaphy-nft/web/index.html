<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>ZETAPHY NFT</title>
  <meta name="description" content="ZETAPHY NFT: create, mint, buy and sell NFTs on the ZETAPHY testnet.">
  <link rel="canonical" href="https://nft.sawasdeecoin.com/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ZETAPHY">
  <meta property="og:title" content="ZETAPHY NFT">
  <meta property="og:description" content="ZETAPHY NFT: create, mint, buy and sell NFTs on the ZETAPHY testnet.">
  <meta property="og:url" content="https://nft.sawasdeecoin.com/">
  <meta property="og:image" content="https://nft.sawasdeecoin.com/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#/">
      <img src="./logo.svg" alt="" width="32" height="32">
      <span class="brand-text"><strong>ZETAPHY</strong><small data-i18n="brandSub">NFT · ZETAPHY testnet</small></span>
    </a>
    <div class="tools">
      <select id="lang" class="lang-select" aria-label="Switch language"><option value="en" lang="en">English</option></select>
      <button type="button" id="theme" class="btn ghost" aria-label="theme"><span class="theme-icon" aria-hidden="true"></span></button>
      <button type="button" id="connect" class="btn primary">Connect wallet</button>
    </div>
    <nav>
      <a href="#/" data-i18n="explore">Explore</a>
      <a href="#/create" data-i18n="create">Create</a>
      <a href="#/me" data-i18n="myNfts">My NFTs</a>
      <a href="#/settings" data-i18n="settings">Settings</a>
      <a id="explorer-link" target="_blank" rel="noopener noreferrer">Explorer ↗</a>
    </nav>
  </header>
  <p class="testnet" data-i18n="testnet">Testnet only.</p>
  <div id="ws-host"></div>
  <main id="main"></main>
  <div id="status" class="status" role="status" aria-live="polite" hidden></div>
  <dialog id="walletDialog">
    <div class="dialog-head"><strong data-i18n="chooseWallet">Choose a wallet</strong><button type="button" class="btn ghost close" data-i18n="close">Close</button></div>
    <div class="dialog-body"></div>
  </dialog>
  <footer><p data-i18n="footer"></p><p class="small" id="footer-help"></p></footer>
</body>
</html>
